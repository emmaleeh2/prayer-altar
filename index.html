<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Prayer Altar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #53505e;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 15% 15%,
          rgba(255, 210, 225, .72) 0,
          transparent 28%),

        radial-gradient(circle at 85% 18%,
          rgba(205, 229, 255, .85) 0,
          transparent 32%),

        radial-gradient(circle at 15% 78%,
          rgba(205, 245, 232, .70) 0,
          transparent 31%),

        radial-gradient(circle at 82% 78%,
          rgba(225, 209, 255, .72) 0,
          transparent 34%),

        linear-gradient(
          145deg,
          #fffdf7 0%,
          #f8f2ff 25%,
          #eef8ff 48%,
          #fff3f7 72%,
          #f2fff9 100%
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .48;

      background:
        radial-gradient(circle at 50% -10%,
          rgba(255,255,255,.95) 0,
          rgba(255,255,255,.35) 25%,
          transparent 52%);
    }

    .light {
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 850px;
      height: 700px;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(255,255,255,.9),
          rgba(255,248,218,.25) 35%,
          transparent 68%
        );

      filter: blur(12px);
    }

    .page {
      position: relative;
      width: min(92%, 760px);
      margin: auto;
      padding: 70px 0 80px;
      text-align: center;
    }

    .star {
      color: #c8a56b;
      font-size: 27px;
      letter-spacing: 12px;
      margin-bottom: 18px;
      text-shadow: 0 0 15px rgba(255,220,150,.7);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #a58b68;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-weight: normal;
      font-size: clamp(42px, 9vw, 73px);
      line-height: .98;
      letter-spacing: -2px;

      color: #555064;

      text-shadow:
        0 2px 0 rgba(255,255,255,.8),
        0 7px 30px rgba(174,155,201,.18);
    }

    .subtitle {
      max-width: 530px;
      margin: 24px auto 0;

      color: #777080;
      font-size: 17px;
      line-height: 1.8;
      font-style: italic;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;

      width: min(420px, 85%);
      margin: 38px auto;

      color: #c6a26b;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(190,153,96,.65),
        transparent
      );
    }

    .scripture {
      max-width: 520px;
      margin: auto;

      color: #777080;
      font-size: 15px;
      line-height: 1.8;
    }

    .scripture strong {
      display: block;
      margin-top: 8px;

      color: #a28a68;
      font-weight: normal;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .altar {
      position: relative;

      margin: 45px auto 0;
      padding: 44px 38px 40px;

      border: 1px solid rgba(195,166,122,.38);
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.72),
          rgba(255,255,255,.38)
        );

      box-shadow:
        0 30px 80px rgba(112,99,142,.12),
        inset 0 1px 0 rgba(255,255,255,.9);

      backdrop-filter: blur(12px);
    }

    .altar::before {
      content: "✦";
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);

      width: 38px;

      color: #c9a56b;
      font-size: 25px;

      background: #fbf9ff;
    }

    .candle {
      position: relative;
      width: 46px;
      height: 88px;
      margin: 24px auto 27px;

      border-radius: 8px 8px 4px 4px;

      background:
        linear-gradient(
          90deg,
          #f1e5d4,
          #fffaf1 48%,
          #ead8c3
        );

      box-shadow:
        0 12px 25px rgba(138,112,82,.14);
    }

    .wick {
      position: absolute;
      top: -10px;
      left: 50%;

      width: 2px;
      height: 12px;

      background: #796958;
      transform: translateX(-50%);
    }

    .flame {
      position: absolute;
      top: -44px;
      left: 50%;

      width: 22px;
      height: 38px;

      transform: translateX(-50%);
      border-radius: 55% 45% 55% 45%;
