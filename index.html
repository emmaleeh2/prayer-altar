<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Prayer Altar</title>

<style>

/* =====================================================
   PAGE
===================================================== */

*{
    box-sizing:border-box;
}

html{
    margin:0;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% 25%,
            #fff8f5 0%,
            #eee3f6 50%,
            #ddd2ed 100%
        );
}


/* =====================================================
   SHRINE
===================================================== */

.shrine{
    position:relative;

    width:min(700px,100vw);
    aspect-ratio:2 / 3;

    flex:none;
    overflow:hidden;

    box-shadow:
        0 0 35px rgba(111,83,133,.12);
}

.art{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    user-select:none;
    pointer-events:none;

    z-index:1;
}


/* =====================================================
   JESUS — HALO LIGHT
===================================================== */

.halo-glow{
    position:absolute;

    z-index:2;

    left:36.5%;
    top:16.2%;

    width:27%;
    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,240,.34) 0%,
            rgba(255,240,180,.22) 27%,
            rgba(255,214,145,.10) 48%,
            transparent 73%
        );

    filter:blur(4px);

    mix-blend-mode:screen;

    animation:
        haloPulse 5s ease-in-out infinite;
}

@keyframes haloPulse{

    0%,100%{
        opacity:.38;
        transform:scale(.96);
    }

    50%{
        opacity:.82;
        transform:scale(1.06);
    }
}


/* =====================================================
   JESUS — CHEST LIGHT
===================================================== */

.chest-glow{
    position:absolute;

    z-index:3;

    left:43%;
    top:29.3%;

    width:14%;
    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,245,.72) 0%,
            rgba(255,241,184,.38) 22%,
            rgba(255,211,156,.16) 45%,
            transparent 72%
        );

    filter:blur(5px);

    mix-blend-mode:screen;

    animation:
        chestPulse 3.8s ease-in-out infinite;
}

@keyframes chestPulse{

    0%,100%{
        opacity:.32;
        transform:scale(.88);
    }

    50%{
        opacity:.76;
        transform:scale(1.12);
    }
}


/* =====================================================
   EXISTING CANDLE LIGHT

   IMPORTANT:
   These are NOT flames.

   The painted flames in the artwork remain untouched.
   These tiny transparent lights simply brighten and
   dim around them.
===================================================== */

.candle-glow{
    position:absolute;

    z-index:4;

    width:18px;
    height:18px;

    margin-left:-9px;
    margin-top:-9px;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,220,.55) 0%,
            rgba(255,225,135,.28) 25%,
            rgba(255,186,91,.10) 48%,
            transparent 72%
        );

    filter:blur(2px);

    mix-blend-mode:screen;

    animation:
        candleFlicker 1.8s ease-in-out infinite;
}


@keyframes candleFlicker{

    0%,100%{
        opacity:.18;
        transform:scale(.72);
    }

    25%{
        opacity:.55;
        transform:scale(1.04);
    }

    48%{
        opacity:.28;
        transform:scale(.83);
    }

    72%{
        opacity:.68;
        transform:scale(1.12);
    }
}


/* slightly different timings */

.cg2{
    animation-delay:-.8s;
    animation-duration:2.1s;
}

.cg3{
    animation-delay:-1.3s;
    animation-duration:1.7s;
}

.cg4{
    animation-delay:-.4s;
    animation-duration:2.3s;
}

.cg5{
    animation-delay:-1.6s;
    animation-duration:1.9s;
}

.cg6{
    animation-delay:-.7s;
    animation-duration:2.2s;
}

.cg7{
    animation-delay:-1.1s;
    animation-duration:1.6s;
}

.cg8{
    animation-delay:-.2s;
    animation-duration:2s;
}

.cg9{
    animation-delay:-1.4s;
    animation-duration:2.4s;
}

.cg10{
    animation-delay:-.9s;
    animation-duration:1.75s;
}

.cg11{
    animation-delay:-1.7s;
    animation-duration:2.15s;
}

.cg12{
    animation-delay:-.5s;
    animation-duration:1.85s;
}


/*
   Glow centres.

   Notice that there are deliberately fewer of these
   than before. We're only animating prominent flames.
*/

.cg1{
    left:27.6%;
    top:29.1%;
}

.cg2{
    left:72.4%;
    top:29.1%;
}

.cg3{
    left:44.6%;
    top:43.8%;
}

.cg4{
    left:49.7%;
    top:43.5%;
}

.cg5{
    left:55.1%;
    top:44.1%;
}

.cg6{
    left:39.9%;
    top:46.1%;
}

.cg7{
    left:59.7%;
    top:46.3%;
}

.cg8{
    left:35.5%;
    top:47.5%;
}

.cg9{
    left:64.4%;
    top:47.4%;
}

.cg10{
    left:42.8%;
    top:49.1%;
}

.cg11{
    left:52.8%;
    top:49.1%;
}

.cg12{
    left:69.2%;
    top:48.8%;
}


/* =====================================================
   SMALL TWINKLES

   These are intentionally tiny.
===================================================== */

.twinkle{
    position:absolute;

    z-index:4;

    width:3px;
    height:3px;

    margin:-1.5px;

    border-radius:50%;

    pointer-events:none;

    background:#fff;

    opacity:0;

    box-shadow:
        0 0 3px rgba(255,255,255,.95),
        0 0 7px rgba(255,231,170,.8);

    animation:
        twinkle 4.2s ease-in-out infinite;
}


@keyframes twinkle{

    0%,72%,100%{
        opacity:0;
        transform:scale(.4);
    }

    79%{
        opacity:.35;
        transform:scale(.8);
    }

    84%{
        opacity:1;
        transform:scale(1.7);
    }

    89%{
        opacity:.25;
        transform:scale(.65);
    }
}


/* SKY TWINKLES */

.t1  {left:7%;  top:4%;  animation-delay:-.5s;}
.t2  {left:14%; top:7%;  animation-delay:-2.1s;}
.t3  {left:22%; top:3%;  animation-delay:-3.4s;}
.t4  {left:29%; top:10%; animation-delay:-1.3s;}

.t5  {left:39%; top:5%;  animation-delay:-2.8s;}
.t6  {left:45%; top:9%;  animation-delay:-.9s;}
.t7  {left:55%; top:6%;  animation-delay:-3.7s;}
.t8  {left:62%; top:11%; animation-delay:-1.7s;}

.t9  {left:72%; top:4%;  animation-delay:-2.4s;}
.t10 {left:80%; top:8%;  animation-delay:-.3s;}
.t11 {left:88%; top:3%;  animation-delay:-3.1s;}
.t12 {left:94%; top:11%; animation-delay:-1.4s;}

.t13 {left:5%;  top:15%; animation-delay:-3.8s;}
.t14 {left:18%; top:17%; animation-delay:-1.1s;}
.t15 {left:32%; top:15%; animation-delay:-2.5s;}

.t16 {left:68%; top:16%; animation-delay:-.7s;}
.t17 {left:82%; top:17%; animation-delay:-3.3s;}
.t18 {left:96%; top:15%; animation-delay:-1.8s;}


/* =====================================================
   OCCASIONAL CROSS-SHAPED SPARKLE
===================================================== */

.glint{
    position:absolute;

    z-index:4;

    width:1px;
    height:11px;

    pointer-events:none;

    opacity:0;

    background:
        linear-gradient(
            transparent,
            rgba(255,255,245,.95),
            transparent
        );

    filter:
        drop-shadow(0 0 3px #fff);

    animation:
        glint 6s ease-in-out infinite;
}


.glint::after{
    content:"";

    position:absolute;

    width:11px;
    height:1px;

    left:-5px;
    top:5px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,245,.95),
            transparent
        );
}


.g1{
    left:12%;
    top:5%;
    animation-delay:-1s;
}

.g2{
    left:85%;
    top:6%;
    animation-delay:-4s;
}

.g3{
    left:59%;
    top:13%;
    animation-delay:-2.6s;
}

.g4{
    left:26%;
    top:14%;
    animation-delay:-5.1s;
}


@keyframes glint{

    0%,78%,100%{
        opacity:0;
        transform:scale(.4);
    }

    86%{
        opacity:.95;
        transform:scale(1.25);
    }

    92%{
        opacity:.12;
        transform:scale(.7);
    }
}


/* =====================================================
   LOWER POOL SHIMMER

   Very subtle — no waterfall overlay.
===================================================== */

.pool-shimmer{
    position:absolute;

    z-index:3;

    left:18%;
    bottom:0;

    width:64%;
    height:7%;

    overflow:hidden;

    pointer-events:none;

    opacity:.22;

    mix-blend-mode:screen;
}


.pool-shimmer::before{
    content:"";

    position:absolute;

    left:-60%;

    width:55%;
    height:100%;

    background:
        linear-gradient(
            105deg,
            transparent,
            rgba(255,255,255,.08),
            rgba(255,237,190,.30),
            rgba(226,219,255,.20),
            transparent
        );

    animation:
        poolShimmer 9s ease-in-out infinite;
}


@keyframes poolShimmer{

    0%{
        transform:translateX(0);
        opacity:.15;
    }

    50%{
        transform:translateX(290%);
        opacity:.65;
    }

    100%{
        transform:translateX(0);
        opacity:.15;
    }
}


/* =====================================================
   VISITOR CANDLE RESPONSE
===================================================== */

.visitor-light{
    position:absolute;

    z-index:5;

    left:45%;
    top:45%;

    width:10%;
    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(255,255,225,.55),
            rgba(255,219,128,.23) 36%,
            transparent 72%
        );

    filter:blur(3px);

    mix-blend-mode:screen;

    transition:opacity 1.2s ease;

    animation:
        visitorGlow 2.5s ease-in-out infinite alternate;
}


.visitor-light.lit{
    opacity:1;
}


@keyframes visitorGlow{

    from{
        transform:scale(.88);
    }

    to{
        transform:scale(1.13);
    }
}


/* =====================================================
   LIGHT A CANDLE PANEL
===================================================== */

.candle-panel{
    position:absolute;

    z-index:10;

    left:14%;
    top:57.2%;

    width:72%;
    height:9.5%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-family:
        "Courier New",
        Courier,
        monospace;
}


/* =====================================================
   HEADINGS
===================================================== */

.candle-title,
.prayer-title{
    color:#493154;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:2px;

    text-shadow:
        1px 1px rgba(255,255,255,.95),
        0 0 4px rgba(255,255,255,.8);
}


.candle-title{
    margin:0 0 14px;
    font-size:20px;
}


.prayer-title{
    margin:0 0 13px;
    font-size:20px;
}


.candle-title::before,
.candle-title::after,
.prayer-title::before,
.prayer-title::after{
    content:"✦";

    color:#996633;

    margin:0 8px;
}


/* =====================================================
   BUTTONS
===================================================== */

.light-button,
.offer-button{
    appearance:none;

    border:1px solid #865c35;
    border-radius:0;

    background:
        linear-gradient(
            #fff8d9,
            #e9c88c
        );

    box-shadow:
        inset 1px 1px white,
        inset -1px -1px rgba(91,57,31,.28),
        0 2px 3px rgba(71,45,68,.12);

    color:#503326;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    text-shadow:
        1px 1px rgba(255,255,255,.7);

    transition:
        box-shadow .2s,
        background .2s,
        transform .1s;
}


.light-button{
    padding:9px 27px;
    font-size:13px;
}


.offer-button{
    padding:9px 25px;
    font-size:13px;
}


.light-button:hover,
.offer-button:hover{
    background:
        linear-gradient(
            #fffbe3,
            #efd099
        );

    box-shadow:
        0 0 11px rgba(255,204,99,.7),
        inset 1px 1px white;
}


.light-button:active,
.offer-button:active{
    transform:translateY(1px);
}


/* =====================================================
   CANDLE MESSAGE
===================================================== */

.candle-message{
    min-height:16px;

    margin-top:10px;

    color:#4d3657;

    font-size:11px;
    font-weight:bold;

    text-align:center;
}


/* =====================================================
   PRAYER PANEL
===================================================== */

.prayer-panel{
    position:absolute;

    z-index:10;

    left:18.5%;
    top:69%;

    width:63%;
    height:19.5%;

    display:flex;
    flex-direction:column;
    align-items:center;

    font-family:
        "Courier New",
        Courier,
        monospace;
}


#prayerForm{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
}


/* =====================================================
   TEXTAREA
===================================================== */

textarea{
    display:block;

    width:100%;
    height:150px;

    padding:13px;

    resize:none;
    outline:none;

    border:1px solid #684b73;
    border-radius:0;

    background:
        rgba(255,246,244,.57);

    box-shadow:
        inset 1px 1px rgba(255,255,255,.88),
        0 0 4px rgba(83,54,91,.14);

    color:#3d2947;

    caret-color:#805329;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:14px;
    font-weight:500;

    line-height:1.55;
}


textarea:focus{
    border-color:#8b5b31;

    background:
        rgba(255,249,242,.67);

    box-shadow:
        0 0 7px rgba(255,205,108,.42),
        inset 1px 1px white;
}


/* =====================================================
   FORM BOTTOM
===================================================== */

.form-bottom{
    position:relative;

    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-top:12px;
}


.counter{
    position:absolute;

    right:0;

    color:#493451;

    font-size:10px;
    font-weight:bold;
}


/* =====================================================
   PRIVACY
===================================================== */

.privacy{
    width:96%;

    margin:14px auto 0;

    color:#432d4c;

    text-align:center;

    font-size:11px;
    font-weight:bold;

    line-height:1.55;

    text-shadow:
        1px 1px rgba(255,255,255,.85);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .shrine{
        width:100vw;
    }

    .candle-glow{
        width:14px;
        height:14px;

        margin-left:-7px;
        margin-top:-7px;
    }
}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    .halo-glow,
    .chest-glow,
    .candle-glow,
    .twinkle,
    .glint,
    .pool-shimmer::before,
    .visitor-light{
        animation:none !important;
    }
}

</style>
</head>


<body>


<main class="shrine">


<!-- ORIGINAL ART -->

<img
    class="art"
    src="prayer-altar-shrine.png"
    alt="Pastel celestial prayer shrine centred on Jesus."
>


<!-- JESUS LIGHT -->

<div class="halo-glow"></div>
<div class="chest-glow"></div>


<!-- EXISTING CANDLE GLOWS -->

<i class="candle-glow cg1"></i>
<i class="candle-glow cg2"></i>
<i class="candle-glow cg3"></i>
<i class="candle-glow cg4"></i>
<i class="candle-glow cg5"></i>
<i class="candle-glow cg6"></i>
<i class="candle-glow cg7"></i>
<i class="candle-glow cg8"></i>
<i class="candle-glow cg9"></i>
<i class="candle-glow cg10"></i>
<i class="candle-glow cg11"></i>
<i class="candle-glow cg12"></i>


<!-- SKY TWINKLES -->

<i class="twinkle t1"></i>
<i class="twinkle t2"></i>
<i class="twinkle t3"></i>
<i class="twinkle t4"></i>
<i class="twinkle t5"></i>
<i class="twinkle t6"></i>
<i class="twinkle t7"></i>
<i class="twinkle t8"></i>
<i class="twinkle t9"></i>
<i class="twinkle t10"></i>
<i class="twinkle t11"></i>
<i class="twinkle t12"></i>
<i class="twinkle t13"></i>
<i class="twinkle t14"></i>
<i class="twinkle t15"></i>
<i class="twinkle t16"></i>
<i class="twinkle t17"></i>
<i class="twinkle t18"></i>


<!-- OCCASIONAL GLINTS -->

<i class="glint g1"></i>
<i class="glint g2"></i>
<i class="glint g3"></i>
<i class="glint g4"></i>


<!-- SUBTLE LOWER WATER REFLECTION -->

<div class="pool-shimmer"></div>


<!-- VISITOR LIGHT -->

<div
    class="visitor-light"
    id="visitorLight">
</div>


<!-- LIGHT A CANDLE -->

<section class="candle-panel">

    <h2 class="candle-title">
        Light a Candle
    </h2>

    <button
        type="button"
        class="light-button"
        id="lightButton">

        LIGHT CANDLE

    </button>

    <div
        class="candle-message"
        id="candleMessage">
    </div>

</section>


<!-- LEAVE A PRAYER -->

<section class="prayer-panel">

    <h2 class="prayer-title">
        Leave a Prayer
    </h2>

    <form id="prayerForm">

        <textarea
            id="prayer"
            name="prayer"
            maxlength="5000"
            required
            aria-label="Write your prayer intention"></textarea>

        <div class="form-bottom">

            <span class="counter">
                <span id="count">0</span> / 5000
            </span>

            <button
                type="submit"
                class="offer-button">

                OFFER PRAYER

            </button>

        </div>

    </form>

    <p class="privacy">
        Your prayer intention will be received privately and prayed over personally.
        Prayers are not displayed publicly
    </p>

</section>


</main>


<script>

/* LIGHT A CANDLE */

const lightButton =
    document.getElementById("lightButton");

const visitorLight =
    document.getElementById("visitorLight");

const candleMessage =
    document.getElementById("candleMessage");


lightButton.addEventListener("click", () => {

    visitorLight.classList.add("lit");

    candleMessage.textContent =
        "✦ YOUR CANDLE HAS BEEN LIT ✦";

    lightButton.textContent =
        "CANDLE LIT";
});


/* CHARACTER COUNTER */

const prayer =
    document.getElementById("prayer");

const count =
    document.getElementById("count");


prayer.addEventListener("input", () => {

    count.textContent =
        prayer.value.length;
});


/* SUBMISSION TEMPORARILY DISABLED */

document
    .getElementById("prayerForm")
    .addEventListener("submit", event => {

        event.preventDefault();
    });

</script>


</body>
</html>
