<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Prayer Altar</title>

<style>

/* =========================================================
   BASIC PAGE
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    overflow-x:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 25%,
            #fff8f5 0%,
            #eee3f6 50%,
            #ddd2ed 100%
        );
}


/* =========================================================
   SHRINE

   Desktop:
   maximum width 700px.

   Mobile:
   the ENTIRE shrine shrinks proportionally to the width
   of the phone instead of being cropped.
========================================================= */

.shrine{
    position:relative;

    width:700px;
    max-width:100%;

    aspect-ratio:2 / 3;

    margin:0 auto;

    overflow:hidden;

    box-shadow:
        0 0 35px rgba(111,83,133,.12);
}


.art{
    position:absolute;

    inset:0;

    z-index:1;

    display:block;

    width:100%;
    height:100%;

    object-fit:fill;

    pointer-events:none;
    user-select:none;
}


/* =========================================================
   JESUS — HALO GLOW
========================================================= */

.halo-glow{
    position:absolute;

    z-index:2;

    left:37%;
    top:17%;

    width:26%;

    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,

            rgba(255,255,240,.48) 0%,
            rgba(255,238,164,.28) 27%,
            rgba(255,207,130,.12) 50%,

            transparent 73%
        );

    filter:blur(4px);

    mix-blend-mode:screen;

    animation:
        haloPulse 4.5s ease-in-out infinite;
}


@keyframes haloPulse{

    0%,
    100%{
        opacity:.42;
        transform:scale(.94);
    }

    50%{
        opacity:.95;
        transform:scale(1.08);
    }

}


/* =========================================================
   JESUS — CHEST GLOW
========================================================= */

.chest-glow{
    position:absolute;

    z-index:3;

    left:43%;
    top:31.3%;

    width:14%;

    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,

            rgba(255,255,245,.9) 0%,
            rgba(255,239,166,.52) 20%,
            rgba(255,194,118,.23) 43%,

            transparent 72%
        );

    filter:blur(5px);

    mix-blend-mode:screen;

    animation:
        chestPulse 3s ease-in-out infinite;
}


@keyframes chestPulse{

    0%,
    100%{
        opacity:.40;
        transform:scale(.82);
    }

    50%{
        opacity:1;
        transform:scale(1.18);
    }

}


/* =========================================================
   FLICKERING DECORATIVE CANDLES
========================================================= */

.flame{
    position:absolute;

    z-index:7;

    width:6px;
    height:14px;

    margin-left:-3px;
    margin-top:-12px;

    pointer-events:none;

    border-radius:
        60% 60% 55% 55% /
        75% 75% 40% 40%;

    transform-origin:
        50% 100%;

    background:
        radial-gradient(
            ellipse at 50% 70%,

            #ffffff 0%,
            #fffbd0 18%,
            #ffe16e 40%,
            #ffad45 63%,
            rgba(255,142,42,.7) 72%,

            transparent 78%
        );

    box-shadow:
        0 0 3px rgba(255,255,220,.95),
        0 0 7px rgba(255,210,91,.9),
        0 0 13px rgba(255,166,64,.55);

    animation:
        flameDance 1s ease-in-out infinite alternate;
}


.flame::after{
    content:"";

    position:absolute;

    left:50%;
    top:60%;

    width:25px;
    height:25px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,

            rgba(255,225,120,.32),

            rgba(255,190,75,.12) 42%,

            transparent 70%
        );

    filter:blur(2px);
}


@keyframes flameDance{

    0%{
        opacity:.72;

        transform:
            translateX(-1px)
            scale(.78,1.15)
            rotate(-5deg);
    }

    22%{
        opacity:1;

        transform:
            translateX(1px)
            scale(1.08,.88)
            rotate(4deg);
    }

    48%{
        opacity:.80;

        transform:
            translateX(0)
            scale(.86,1.22)
            rotate(-2deg);
    }

    73%{
        opacity:1;

        transform:
            translateX(-1px)
            scale(1.10,.92)
            rotate(5deg);
    }

    100%{
        opacity:.82;

        transform:
            translateX(1px)
            scale(.83,1.17)
            rotate(-4deg);
    }

}


/* =========================================================
   CORRECTED FLAME POSITIONS
========================================================= */


/* tall left candle */

.f1{
    left:27.6%;
    top:28.55%;

    width:7px;
    height:16px;

    animation-duration:.92s;
}


/* tall right candle */

.f2{
    left:72.15%;
    top:28.55%;

    width:7px;
    height:16px;

    animation-duration:1.08s;
    animation-delay:-.48s;
}


/* smaller altar candles */

.f3{
    left:33.65%;
    top:45.55%;

    animation-duration:.83s;
    animation-delay:-.31s;
}


.f4{
    left:42.15%;
    top:45.35%;

    animation-duration:1.17s;
    animation-delay:-.71s;
}


.f5{
    left:49.65%;
    top:44.75%;

    animation-duration:.89s;
    animation-delay:-.22s;
}


.f6{
    left:56.35%;
    top:46.05%;

    animation-duration:1.13s;
    animation-delay:-.82s;
}


.f7{
    left:62.75%;
    top:45.65%;

    animation-duration:.96s;
    animation-delay:-.44s;
}


.f8{
    left:67.35%;
    top:47.25%;

    animation-duration:1.21s;
    animation-delay:-.67s;
}


/* =========================================================
   WATERFALLS
========================================================= */

.fall{
    position:absolute;

    z-index:4;

    overflow:hidden;

    pointer-events:none;

    mix-blend-mode:screen;

    opacity:.72;
}


.fall-left{
    left:4.9%;
    top:36.1%;

    width:10.2%;
    height:11.8%;

    clip-path:
        polygon(
            18% 0%,
            88% 0%,
            82% 18%,
            94% 38%,
            78% 58%,
            90% 78%,
            66% 100%,
            8% 100%,
            18% 80%,
            5% 60%,
            17% 39%,
            8% 20%
        );
}


.fall-right{
    right:4.8%;
    top:36.1%;

    width:10.2%;
    height:11.8%;

    clip-path:
        polygon(
            12% 0%,
            82% 0%,
            92% 19%,
            80% 38%,
            95% 59%,
            81% 79%,
            92% 100%,
            25% 100%,
            10% 79%,
            21% 59%,
            7% 38%,
            18% 18%
        );
}


.fall::before{
    content:"";

    position:absolute;

    left:0;
    top:-100%;

    width:100%;
    height:220%;

    background:
        repeating-linear-gradient(
            to bottom,

            transparent 0px,
            transparent 5px,

            rgba(255,255,255,.08) 6px,

            rgba(255,255,255,.72) 9px,

            rgba(205,235,255,.44) 12px,

            transparent 17px,

            transparent 24px
        );

    filter:blur(.4px);

    animation:
        fallingWater 1.15s linear infinite;
}


.fall-right::before{
    animation-duration:1.35s;
    animation-delay:-.6s;
}


@keyframes fallingWater{

    from{
        transform:
            translateY(-18%);
    }

    to{
        transform:
            translateY(28%);
    }

}


.fall::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            90deg,

            transparent 0%,

            rgba(255,255,255,.55) 22%,

            transparent 35%,

            rgba(209,238,255,.48) 53%,

            transparent 67%,

            rgba(255,255,255,.38) 82%,

            transparent 100%
        );

    animation:
        waterFlash 1.7s ease-in-out infinite alternate;
}


@keyframes waterFlash{

    from{
        opacity:.25;

        transform:
            translateX(-5%);
    }

    to{
        opacity:.9;

        transform:
            translateX(5%);
    }

}


/* =========================================================
   WATERFALL SPRAY
========================================================= */

.spray{
    position:absolute;

    z-index:5;

    width:9%;
    height:3%;

    pointer-events:none;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,

            rgba(255,255,255,.55) 0%,

            rgba(216,239,255,.22) 40%,

            transparent 72%
        );

    filter:blur(2px);

    mix-blend-mode:screen;

    animation:
        sprayPulse 1.8s ease-in-out infinite alternate;
}


.spray-left{
    left:5.2%;
    top:45.2%;
}


.spray-right{
    right:5.1%;
    top:45.2%;

    animation-delay:-.9s;
}


@keyframes sprayPulse{

    from{
        opacity:.22;
        transform:scale(.82);
    }

    to{
        opacity:.8;
        transform:scale(1.12);
    }

}


/* =========================================================
   TWINKLES
========================================================= */

.twinkle{
    position:absolute;

    z-index:6;

    width:3px;
    height:3px;

    margin-left:-1px;
    margin-top:-1px;

    border-radius:50%;

    pointer-events:none;

    background:#fff;

    box-shadow:
        0 0 3px #fff,
        0 0 7px #fff0ae,
        0 0 11px rgba(226,205,255,.9);

    opacity:0;

    animation:
        twinkle 3.6s ease-in-out infinite;
}


@keyframes twinkle{

    0%,
    65%,
    100%{
        opacity:0;
        transform:scale(.3);
    }

    74%{
        opacity:.5;
        transform:scale(.8);
    }

    82%{
        opacity:1;
        transform:scale(2.2);
    }

    90%{
        opacity:.35;
        transform:scale(.7);
    }

}


.t1{
    left:9%;
    top:5%;
    animation-delay:-.4s;
}

.t2{
    left:14%;
    top:9%;
    animation-delay:-1.8s;
}

.t3{
    left:21%;
    top:4%;
    animation-delay:-2.7s;
}

.t4{
    left:28%;
    top:12%;
    animation-delay:-.8s;
}

.t5{
    left:37%;
    top:6%;
    animation-delay:-2.2s;
}

.t6{
    left:43%;
    top:12%;
    animation-delay:-1.1s;
}

.t7{
    left:56%;
    top:7%;
    animation-delay:-3.1s;
}

.t8{
    left:63%;
    top:14%;
    animation-delay:-.5s;
}

.t9{
    left:73%;
    top:5%;
    animation-delay:-2.5s;
}

.t10{
    left:81%;
    top:10%;
    animation-delay:-1.4s;
}

.t11{
    left:88%;
    top:4%;
    animation-delay:-3.3s;
}

.t12{
    left:95%;
    top:13%;
    animation-delay:-.9s;
}

.t13{
    left:6%;
    top:17%;
    animation-delay:-2.9s;
}

.t14{
    left:18%;
    top:16%;
    animation-delay:-.3s;
}

.t15{
    left:31%;
    top:18%;
    animation-delay:-1.9s;
}

.t16{
    left:68%;
    top:17%;
    animation-delay:-2.4s;
}

.t17{
    left:82%;
    top:18%;
    animation-delay:-.7s;
}

.t18{
    left:94%;
    top:19%;
    animation-delay:-3.5s;
}


/* =========================================================
   STAR GLINTS
========================================================= */

.glint{
    position:absolute;

    z-index:6;

    width:2px;
    height:14px;

    pointer-events:none;

    opacity:0;

    background:
        linear-gradient(
            transparent,
            white,
            transparent
        );

    filter:
        drop-shadow(0 0 4px white)
        drop-shadow(0 0 7px #ffe89d);

    animation:
        glint 5s ease-in-out infinite;
}


.glint::after{
    content:"";

    position:absolute;

    width:14px;
    height:2px;

    left:-6px;
    top:6px;

    background:
        linear-gradient(
            90deg,
            transparent,
            white,
            transparent
        );
}


.g1{
    left:13.5%;
    top:5%;
    animation-delay:-1s;
}

.g2{
    left:87%;
    top:7%;
    animation-delay:-3.2s;
}

.g3{
    left:57%;
    top:12%;
    animation-delay:-2s;
}

.g4{
    left:29%;
    top:15%;
    animation-delay:-4.1s;
}


@keyframes glint{

    0%,
    74%,
    100%{
        opacity:0;
        transform:scale(.4);
    }

    84%{
        opacity:1;
        transform:scale(1.5);
    }

    92%{
        opacity:.2;
        transform:scale(.7);
    }

}


/* =========================================================
   PRAYER AREA

   Light-a-Candle is completely removed.

   Heading sits in the blank altar panel.
   Text box sits inside the lower pink framed area.
========================================================= */

.prayer-panel{
    position:absolute;

    z-index:20;

    left:18%;
    top:57%;

    width:64%;
    height:31%;

    font-family:
        "Courier New",
        Courier,
        monospace;
}


/* =========================================================
   LEAVE A PRAYER TITLE
========================================================= */

.prayer-title{
    position:absolute;

    top:3%;
    left:0;

    width:100%;

    margin:0;

    text-align:center;

    color:#493154;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:20px;
    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:2px;

    text-shadow:
        1px 1px rgba(255,255,255,.95),
        0 0 4px rgba(255,255,255,.8);
}


.prayer-title::before,
.prayer-title::after{
    content:"✦";

    color:#996633;

    margin:0 8px;
}


/* =========================================================
   FORM
========================================================= */

#prayerForm{
    position:absolute;

    left:0;
    top:29%;

    width:100%;

    margin:0;
}


/* =========================================================
   TEXTAREA

   SOLID background.
   BLACK border.
   No transparency.
========================================================= */

textarea{
    display:block;

    width:100%;
    height:145px;

    margin:0;

    padding:13px;

    resize:none;

    outline:none;

    border:1px solid #000;

    border-radius:0;

    background:#fffaf4;

    color:#2d2230;

    caret-color:#000;

    box-shadow:none;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:14px;
    font-weight:500;

    line-height:1.5;
}


textarea:focus{
    border:1px solid #000;

    background:#fffdf9;

    outline:1px solid rgba(128,92,140,.35);

    box-shadow:none;
}


/* =========================================================
   OFFER PRAYER ROW
========================================================= */

.form-bottom{
    position:relative;

    width:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    margin-top:12px;
}


.counter{
    position:absolute;

    right:0;

    color:#35293a;

    font-size:10px;
    font-weight:bold;
}


/* =========================================================
   OFFER PRAYER BUTTON
========================================================= */

.offer-button{
    appearance:none;

    padding:9px 25px;

    border:1px solid #865c35;

    border-radius:0;

    background:
        linear-gradient(
            #fff8d9,
            #e9c88c
        );

    box-shadow:
        inset 1px 1px white,
        inset -1px -1px rgba(91,57,31,.28),
        0 2px 3px rgba(71,45,68,.12);

    color:#503326;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:13px;
    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    text-shadow:
        1px 1px rgba(255,255,255,.7);

    transition:
        box-shadow .2s,
        background .2s,
        transform .1s;
}


.offer-button:hover{
    background:
        linear-gradient(
            #fffbe3,
            #efd099
        );

    box-shadow:
        0 0 11px rgba(255,204,99,.7),
        inset 1px 1px white;
}


.offer-button:active{
    transform:translateY(1px);
}


/* =========================================================
   PRIVACY
========================================================= */

.privacy{
    position:absolute;

    left:0;
    top:83%;

    width:100%;

    margin:0;

    color:#432d4c;

    text-align:center;

    font-size:11px;
    font-weight:bold;

    line-height:1.5;

    text-shadow:
        1px 1px rgba(255,255,255,.9);
}


/* =========================================================
   MOBILE

   Everything remains in exactly the same relative position,
   but the whole 2:3 shrine scales down to the phone width.
========================================================= */

@media(max-width:700px){

    body{
        width:100%;
        min-width:0;
    }

    .shrine{
        width:100vw;
        max-width:100vw;

        margin:0;

        aspect-ratio:2 / 3;
    }


    /* Scale typography down with the artwork */

    .prayer-title{
        font-size:clamp(12px,3.7vw,20px);
        letter-spacing:1px;
    }


    .prayer-title::before,
    .prayer-title::after{
        margin:0 4px;
    }


    textarea{
        height:clamp(80px,21vw,145px);

        padding:8px;

        font-size:clamp(10px,2.8vw,14px);
    }


    .offer-button{
        padding:
            clamp(5px,1.5vw,9px)
            clamp(12px,4vw,25px);

        font-size:
            clamp(9px,2.5vw,13px);

        letter-spacing:1px;
    }


    .counter{
        font-size:
            clamp(7px,1.8vw,10px);
    }


    .privacy{
        font-size:
            clamp(8px,2.1vw,11px);

        line-height:1.35;
    }


    /* animation details shrink with artwork */

    .flame{
        width:4px;
        height:9px;

        margin-left:-2px;
        margin-top:-8px;

        box-shadow:
            0 0 2px rgba(255,255,220,.95),
            0 0 4px rgba(255,210,91,.9),
            0 0 7px rgba(255,166,64,.55);
    }


    .flame::after{
        width:15px;
        height:15px;
    }


    .twinkle{
        width:2px;
        height:2px;
    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

    #prayerForm{
        top:28%;
    }

    .form-bottom{
        margin-top:7px;
    }

    .privacy{
        top:82%;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    .halo-glow,
    .chest-glow,
    .flame,
    .fall::before,
    .fall::after,
    .spray,
    .twinkle,
    .glint{
        animation:none !important;
    }

}

</style>
</head>


<body>


<main class="shrine">


<!-- =====================================================
     ORIGINAL ARTWORK
===================================================== -->

<img
    class="art"
    src="prayer-altar-shrine.png"
    alt="Pastel celestial prayer shrine centred on Jesus."
>


<!-- =====================================================
     JESUS LIGHT
===================================================== -->

<div class="halo-glow"></div>
<div class="chest-glow"></div>


<!-- =====================================================
     WATERFALLS
===================================================== -->

<div class="fall fall-left"></div>
<div class="fall fall-right"></div>

<div class="spray spray-left"></div>
<div class="spray spray-right"></div>


<!-- =====================================================
     FLICKERING DECORATIVE CANDLES
===================================================== -->

<i class="flame f1"></i>
<i class="flame f2"></i>

<i class="flame f3"></i>
<i class="flame f4"></i>
<i class="flame f5"></i>
<i class="flame f6"></i>
<i class="flame f7"></i>
<i class="flame f8"></i>


<!-- =====================================================
     TWINKLING STARS
===================================================== -->

<i class="twinkle t1"></i>
<i class="twinkle t2"></i>
<i class="twinkle t3"></i>
<i class="twinkle t4"></i>
<i class="twinkle t5"></i>
<i class="twinkle t6"></i>
<i class="twinkle t7"></i>
<i class="twinkle t8"></i>
<i class="twinkle t9"></i>
<i class="twinkle t10"></i>
<i class="twinkle t11"></i>
<i class="twinkle t12"></i>
<i class="twinkle t13"></i>
<i class="twinkle t14"></i>
<i class="twinkle t15"></i>
<i class="twinkle t16"></i>
<i class="twinkle t17"></i>
<i class="twinkle t18"></i>


<!-- =====================================================
     STAR GLINTS
===================================================== -->

<i class="glint g1"></i>
<i class="glint g2"></i>
<i class="glint g3"></i>
<i class="glint g4"></i>


<!-- =====================================================
     LEAVE A PRAYER
===================================================== -->

<section class="prayer-panel">

    <h2 class="prayer-title">
        Leave a Prayer
    </h2>


    <form id="prayerForm">

        <textarea
            id="prayer"
            name="prayer"
            maxlength="5000"
            required
            aria-label="Write your prayer intention"></textarea>


        <div class="form-bottom">

            <span class="counter">
                <span id="count">0</span> / 5000
            </span>


            <button
                type="submit"
                class="offer-button">

                OFFER PRAYER

            </button>

        </div>

    </form>


    <p class="privacy">
        Your prayer intention will be received privately and prayed over personally.
        Prayers are not displayed publicly
    </p>

</section>


</main>


<script>

/* =========================================================
   CHARACTER COUNTER
========================================================= */

const prayer =
    document.getElementById("prayer");

const count =
    document.getElementById("count");


prayer.addEventListener(
    "input",
    () => {

        count.textContent =
            prayer.value.length;

    }
);


/* =========================================================
   PRAYER SUBMISSION

   Still temporarily disabled.

   Once the layout is correct, this is where we'll reconnect
   the existing Supabase Edge Function.
========================================================= */

document
    .getElementById("prayerForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();

        }
    );

</script>


</body>
</html>
