<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Prayer Altar</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #fff8f5 0%,
            #eee3f6 48%,
            #ddd2ed 100%
        );
}


/* ==========================================
   SHRINE
========================================== */

.shrine{
    position:relative;

    width:min(100vw,66.6667vh);
    aspect-ratio:2/3;

    max-height:100vh;

    overflow:hidden;
    flex:none;
}

.art{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;
    pointer-events:none;
    user-select:none;
}


/* ==========================================
   TWINKLING STARS
========================================== */

.star{
    position:absolute;
    z-index:3;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#fffef0;

    opacity:.1;

    pointer-events:none;

    box-shadow:
        0 0 2px white,
        0 0 5px #fff0a8,
        0 0 9px rgba(236,210,255,.85);

    animation:twinkle 3.8s ease-in-out infinite;
}

.s1{left:13.5%;top:5.3%;animation-delay:-.3s}
.s2{left:8.7%;top:7.1%;animation-delay:-2.1s}
.s3{left:18%;top:12%;animation-delay:-1.1s}
.s4{left:87%;top:5.1%;animation-delay:-2.8s}
.s5{left:91%;top:11%;animation-delay:-.8s}
.s6{left:81%;top:15%;animation-delay:-1.8s}
.s7{left:37%;top:10%;animation-delay:-2.4s}
.s8{left:65%;top:9%;animation-delay:-.4s}
.s9{left:5%;top:24%;animation-delay:-1.5s}
.s10{left:95%;top:25%;animation-delay:-2.6s}
.s11{left:19%;top:31%;animation-delay:-.9s}
.s12{left:82%;top:30%;animation-delay:-1.9s}

@keyframes twinkle{

    0%,70%,100%{
        opacity:.08;
        transform:scale(.5);
    }

    80%{
        opacity:.65;
        transform:scale(1.2);
    }

    86%{
        opacity:1;
        transform:scale(2);
    }

    93%{
        opacity:.2;
        transform:scale(.7);
    }
}


/* ==========================================
   WATERFALLS
========================================== */

.waterfall{
    position:absolute;
    z-index:3;

    overflow:hidden;

    pointer-events:none;

    opacity:.35;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 10%,
            black 85%,
            transparent
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 10%,
            black 85%,
            transparent
        );
}

.waterfall.left{
    left:10.5%;
    top:33%;
    width:9%;
    height:13%;
}

.waterfall.right{
    right:10.5%;
    top:33%;
    width:9%;
    height:13%;
}

.waterfall::before{
    content:"";

    position:absolute;

    left:0;
    top:-100%;

    width:100%;
    height:200%;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            rgba(255,255,255,.12) 5px,
            rgba(220,240,255,.34) 9px,
            rgba(255,255,255,.07) 14px,
            transparent 22px
        );

    animation:waterfallFlow 2.5s linear infinite;
}

.waterfall.right::before{
    animation-duration:2.8s;
    animation-delay:-1.2s;
}

@keyframes waterfallFlow{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(50%);
    }
}


/* ==========================================
   POOL SHIMMER
========================================== */

.pool{
    position:absolute;

    z-index:3;

    left:22%;
    bottom:0;

    width:56%;
    height:10%;

    overflow:hidden;

    pointer-events:none;

    opacity:.35;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 35%,
            black
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 35%,
            black
        );
}

.pool::before{
    content:"";

    position:absolute;

    left:-80%;

    width:80%;
    height:100%;

    background:
        linear-gradient(
            105deg,
            transparent,
            rgba(255,255,255,.08),
            rgba(255,237,181,.36),
            rgba(255,255,255,.12),
            transparent
        );

    animation:poolShimmer 8s ease-in-out infinite;
}

@keyframes poolShimmer{

    0%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(225%);
    }

    100%{
        transform:translateX(0);
    }
}


/* ==========================================
   LIGHT A CANDLE
========================================== */

.candle-panel{
    position:absolute;

    z-index:10;

    left:14%;
    top:57.4%;

    width:72%;
    height:9.5%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-family:"Courier New",Courier,monospace;
}

.candle-title{
    margin:0 0 10px;

    color:#51385f;

    font-family:"Courier New",Courier,monospace;

    font-size:15px;
    font-weight:bold;

    letter-spacing:2px;

    text-transform:uppercase;

    text-shadow:
        1px 1px rgba(255,255,255,.95),
        0 0 4px rgba(255,255,255,.8);
}

.candle-title::before,
.candle-title::after{
    content:"✦";

    color:#9b6b37;

    margin:0 7px;
}


/* ==========================================
   BUTTONS
========================================== */

.light-button,
.offer-button{

    appearance:none;

    border:1px solid #8f673d;
    border-radius:0;

    background:
        linear-gradient(
            #fff7da,
            #e9c990
        );

    box-shadow:
        inset 1px 1px white,
        inset -1px -1px rgba(90,58,34,.25),
        0 1px 2px rgba(82,54,72,.15);

    color:#553b31;

    font-family:"Courier New",Courier,monospace;

    font-weight:bold;

    letter-spacing:1.5px;

    cursor:pointer;

    text-shadow:
        1px 1px rgba(255,255,255,.65);
}

.light-button{
    padding:7px 20px;
    font-size:11px;
}

.offer-button{
    padding:7px 18px;
    font-size:10px;
}

.light-button:hover,
.offer-button:hover{

    background:
        linear-gradient(
            #fff9df,
            #efd09a
        );

    box-shadow:
        0 0 9px rgba(255,205,104,.65),
        inset 1px 1px white;
}

.light-button:active,
.offer-button:active{
    transform:translateY(1px);
}


/* ==========================================
   CANDLE MESSAGE
========================================== */

.candle-message{
    margin-top:8px;

    min-height:12px;

    color:#513b5d;

    font-family:"Courier New",Courier,monospace;

    font-size:8px;
    font-weight:bold;

    text-align:center;
}


/* ==========================================
   LEAVE A PRAYER
========================================== */

.prayer-panel{
    position:absolute;

    z-index:10;

    left:18.5%;
    top:69.1%;

    width:63%;
    height:19%;

    display:flex;
    flex-direction:column;
    align-items:center;

    font-family:"Courier New",Courier,monospace;
}

.prayer-title{
    margin:0 0 10px;

    color:#51385f;

    font-family:"Courier New",Courier,monospace;

    font-size:15px;
    font-weight:bold;

    letter-spacing:2px;

    text-transform:uppercase;

    text-shadow:
        1px 1px rgba(255,255,255,.95),
        0 0 4px rgba(255,255,255,.8);
}

.prayer-title::before,
.prayer-title::after{
    content:"✦";

    color:#9b6b37;

    margin:0 7px;
}


/* ==========================================
   PRAYER FORM
========================================== */

#prayerForm{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
}

textarea{
    display:block;

    width:100%;
    height:92px;

    padding:9px;

    resize:none;

    outline:none;

    border:1px solid #755b7e;

    border-radius:0;

    /*
       Still translucent enough to see the shrine,
       but now obviously a writable area.
    */

    background:
        rgba(255,246,244,.55);

    box-shadow:
        inset 1px 1px rgba(255,255,255,.85),
        0 0 3px rgba(89,61,96,.12);

    color:#432f4d;

    caret-color:#7d542e;

    font-family:"Courier New",Courier,monospace;

    font-size:11px;
    font-weight:500;

    line-height:1.5;
}


/* no placeholder */

textarea:focus{

    border-color:#8c6037;

    background:
        rgba(255,248,240,.65);

    box-shadow:
        0 0 6px rgba(255,204,108,.42),
        inset 1px 1px white;
}


/* ==========================================
   FORM BOTTOM
========================================== */

.form-bottom{
    position:relative;

    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-top:9px;
}

.counter{
    position:absolute;

    right:0;

    color:#4f3a59;

    font-family:"Courier New",Courier,monospace;

    font-size:8px;
    font-weight:bold;
}


/* ==========================================
   PRIVACY WORDING
========================================== */

.privacy{
    width:100%;

    margin:10px 0 0;

    color:#4b3555;

    text-align:center;

    font-family:"Courier New",Courier,monospace;

    font-size:8px;
    font-weight:bold;

    line-height:1.45;

    text-shadow:
        1px 1px rgba(255,255,255,.8);
}


/* ==========================================
   CANDLE LIGHTING EFFECT
========================================== */

.candle-light{
    position:absolute;

    z-index:5;

    left:42%;
    top:45%;

    width:16%;
    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(255,250,201,.58),
            rgba(255,216,120,.2) 38%,
            transparent 72%
        );

    transition:opacity .8s ease;

    animation:
        candleGlow 1.8s ease-in-out infinite alternate;
}

.candle-light.lit{
    opacity:.85;
}

@keyframes candleGlow{

    from{
        transform:scale(.9);
    }

    to{
        transform:scale(1.08);
    }
}


/* ==========================================
   MOBILE
========================================== */

@media(max-aspect-ratio:2/3){

    html,
    body{
        height:auto;
        min-height:100%;
        overflow-x:hidden;
        overflow-y:auto;
    }

    body{
        align-items:flex-start;
    }

    .shrine{
        width:100vw;
        height:auto;
        max-height:none;
    }

}


/* ==========================================
   REDUCED MOTION
========================================== */

@media(prefers-reduced-motion:reduce){

    .star,
    .waterfall::before,
    .pool::before,
    .candle-light{
        animation:none !important;
    }

}

</style>
</head>


<body>

<main class="shrine">


<img
    class="art"
    src="prayer-altar-shrine.png"
    alt="Pastel pixel-art prayer shrine centred on Jesus with candles, flowers, stars, waterfalls and Matthew 11:28."
>


<!-- stars -->

<i class="star s1"></i>
<i class="star s2"></i>
<i class="star s3"></i>
<i class="star s4"></i>
<i class="star s5"></i>
<i class="star s6"></i>
<i class="star s7"></i>
<i class="star s8"></i>
<i class="star s9"></i>
<i class="star s10"></i>
<i class="star s11"></i>
<i class="star s12"></i>


<!-- animated waterfalls -->

<div class="waterfall left"></div>
<div class="waterfall right"></div>


<!-- pool -->

<div class="pool"></div>


<!-- candle illumination -->

<div
    class="candle-light"
    id="candleLight">
</div>


<!-- ======================================
     LIGHT A CANDLE
====================================== -->

<section class="candle-panel">

    <h2 class="candle-title">
        Light a Candle
    </h2>


    <button
        type="button"
        class="light-button"
        id="lightButton">
        LIGHT CANDLE
    </button>


    <div
        class="candle-message"
        id="candleMessage">
    </div>

</section>


<!-- ======================================
     LEAVE A PRAYER
====================================== -->

<section class="prayer-panel">

    <h2 class="prayer-title">
        Leave a Prayer
    </h2>


    <form id="prayerForm">

        <textarea
            id="prayer"
            name="prayer"
            maxlength="5000"
            required
            aria-label="Write your prayer intention"></textarea>


        <div class="form-bottom">

            <span class="counter">
                <span id="count">0</span> / 5000
            </span>


            <button
                type="submit"
                class="offer-button">
                OFFER PRAYER
            </button>

        </div>

    </form>


    <p class="privacy">
        Your prayer intention will be received privately and prayed over personally.
        Prayers are not displayed publicly
    </p>

</section>


</main>


<script>

/* ======================================
   LIGHT CANDLE
====================================== */

const lightButton =
    document.getElementById("lightButton");

const candleLight =
    document.getElementById("candleLight");

const candleMessage =
    document.getElementById("candleMessage");


lightButton.addEventListener("click", () => {

    candleLight.classList.add("lit");

    candleMessage.textContent =
        "✦ YOUR CANDLE HAS BEEN LIT ✦";

});


/* ======================================
   CHARACTER COUNTER
====================================== */

const prayer =
    document.getElementById("prayer");

const count =
    document.getElementById("count");


prayer.addEventListener("input", () => {

    count.textContent =
        prayer.value.length;

});


/* ======================================
   SUBMISSION STILL DISABLED FOR DESIGN
====================================== */

document
    .getElementById("prayerForm")
    .addEventListener("submit", event => {

        event.preventDefault();

    });

</script>

</body>
</html>
