<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Prayer Altar</title>

<style>

/* =====================================================
   PAGE
===================================================== */

*{
    box-sizing:border-box;
}

html{
    margin:0;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% 25%,
            #fff8f5 0%,
            #eee3f6 50%,
            #ddd2ed 100%
        );
}


/* =====================================================
   SHRINE

   Original artwork = 1024 × 1536
   Ratio = 2:3

   Desktop width = maximum 700px.
   Height therefore = 1050px.

   The PAGE scrolls rather than shrinking the shrine.
===================================================== */

.shrine{
    position:relative;

    width:min(700px,100vw);

    aspect-ratio:2 / 3;

    flex:none;

    overflow:hidden;

    box-shadow:
        0 0 35px rgba(111,83,133,.12);
}


.art{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    user-select:none;
    pointer-events:none;
}


/* =====================================================
   TWINKLING STARS
===================================================== */

.star{
    position:absolute;

    z-index:3;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#fffef2;

    pointer-events:none;

    opacity:.1;

    box-shadow:
        0 0 2px white,
        0 0 5px rgba(255,242,176,.95),
        0 0 9px rgba(235,207,255,.85);

    animation:
        twinkle 3.8s ease-in-out infinite;
}


.s1{left:13.5%;top:5.3%;animation-delay:-.3s}
.s2{left:8.7%;top:7.1%;animation-delay:-2.1s}
.s3{left:18%;top:12%;animation-delay:-1.1s}
.s4{left:87%;top:5.1%;animation-delay:-2.8s}
.s5{left:91%;top:11%;animation-delay:-.8s}
.s6{left:81%;top:15%;animation-delay:-1.8s}
.s7{left:37%;top:10%;animation-delay:-2.4s}
.s8{left:65%;top:9%;animation-delay:-.4s}
.s9{left:5%;top:24%;animation-delay:-1.5s}
.s10{left:95%;top:25%;animation-delay:-2.6s}
.s11{left:19%;top:31%;animation-delay:-.9s}
.s12{left:82%;top:30%;animation-delay:-1.9s}


@keyframes twinkle{

    0%,
    70%,
    100%{
        opacity:.08;
        transform:scale(.5);
    }

    80%{
        opacity:.7;
        transform:scale(1.2);
    }

    86%{
        opacity:1;
        transform:scale(2);
    }

    93%{
        opacity:.2;
        transform:scale(.7);
    }

}


/* =====================================================
   CROSS-SHAPED STAR GLINTS
===================================================== */

.starburst{
    position:absolute;

    z-index:3;

    width:2px;
    height:12px;

    pointer-events:none;

    opacity:.15;

    background:
        linear-gradient(
            to bottom,
            transparent,
            #fffde7,
            transparent
        );

    filter:
        drop-shadow(0 0 3px white)
        drop-shadow(0 0 6px #ffe8a7);

    animation:
        starburst 5s ease-in-out infinite;
}


.starburst::after{
    content:"";

    position:absolute;

    width:12px;
    height:2px;

    left:-5px;
    top:5px;

    background:
        linear-gradient(
            to right,
            transparent,
            #fffde7,
            transparent
        );
}


.sb1{
    left:13.5%;
    top:5.2%;
    animation-delay:-1s;
}

.sb2{
    left:86.7%;
    top:6.4%;
    animation-delay:-3.3s;
}

.sb3{
    left:54.5%;
    top:12%;
    animation-delay:-2.2s;
}


@keyframes starburst{

    0%,
    72%,
    100%{
        opacity:.1;
        transform:scale(.55);
    }

    82%{
        opacity:1;
        transform:scale(1.5);
    }

    91%{
        opacity:.25;
        transform:scale(.75);
    }

}


/* =====================================================
   RUNNING WATERFALLS
===================================================== */

.waterfall{
    position:absolute;

    z-index:3;

    overflow:hidden;

    pointer-events:none;

    opacity:.38;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 8%,
            black 88%,
            transparent
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 8%,
            black 88%,
            transparent
        );
}


.waterfall.left{
    left:10.5%;
    top:33%;
    width:9%;
    height:13%;
}


.waterfall.right{
    right:10.5%;
    top:33%;
    width:9%;
    height:13%;
}


.waterfall::before{
    content:"";

    position:absolute;

    left:0;
    top:-100%;

    width:100%;
    height:200%;

    background:
        repeating-linear-gradient(
            to bottom,

            transparent 0px,

            rgba(255,255,255,.13) 6px,

            rgba(220,240,255,.38) 11px,

            rgba(255,255,255,.08) 16px,

            transparent 25px
        );

    animation:
        waterfallFlow 2.5s linear infinite;
}


.waterfall::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        repeating-linear-gradient(
            90deg,

            transparent 0%,
            transparent 15%,

            rgba(255,255,255,.22) 18%,

            transparent 21%,
            transparent 40%,

            rgba(220,240,255,.2) 44%,

            transparent 48%
        );

    animation:
        waterfallLight 2s ease-in-out infinite alternate;
}


.waterfall.right::before{
    animation-duration:2.8s;
    animation-delay:-1.2s;
}


@keyframes waterfallFlow{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(50%);
    }

}


@keyframes waterfallLight{

    from{
        opacity:.2;
        transform:translateX(-2%);
    }

    to{
        opacity:.75;
        transform:translateX(3%);
    }

}


/* =====================================================
   WATERFALL MIST
===================================================== */

.mist{
    position:absolute;

    z-index:3;

    width:12%;
    height:3%;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.6),
            rgba(224,238,255,.18) 45%,
            transparent 72%
        );

    animation:
        mistMove 4.5s ease-in-out infinite alternate;
}


.mist.left{
    left:9%;
    top:43.5%;
}


.mist.right{
    right:9%;
    top:43.5%;

    animation-delay:-2.2s;
}


@keyframes mistMove{

    from{
        opacity:.08;

        transform:
            translateX(-4%)
            scale(.9);
    }

    to{
        opacity:.28;

        transform:
            translateX(5%)
            scale(1.1);
    }

}


/* =====================================================
   POOL SHIMMER
===================================================== */

.pool{
    position:absolute;

    z-index:3;

    left:22%;
    bottom:0;

    width:56%;
    height:10%;

    overflow:hidden;

    pointer-events:none;

    opacity:.4;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 35%,
            black
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 35%,
            black
        );
}


.pool::before{
    content:"";

    position:absolute;

    left:-80%;
    top:0;

    width:80%;
    height:100%;

    background:
        linear-gradient(
            105deg,

            transparent,

            rgba(255,255,255,.08),

            rgba(255,237,181,.38),

            rgba(255,255,255,.12),

            transparent
        );

    animation:
        poolShimmer 8s ease-in-out infinite;
}


@keyframes poolShimmer{

    0%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(225%);
    }

    100%{
        transform:translateX(0);
    }

}


/* =====================================================
   LIGHT A CANDLE PANEL
===================================================== */

.candle-panel{
    position:absolute;

    z-index:10;

    left:14%;
    top:57.2%;

    width:72%;
    height:9.5%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    font-family:
        "Courier New",
        Courier,
        monospace;
}


/* =====================================================
   HEADINGS
===================================================== */

.candle-title,
.prayer-title{

    color:#493154;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:2px;

    text-shadow:
        1px 1px rgba(255,255,255,.95),
        0 0 4px rgba(255,255,255,.8);
}


.candle-title{
    margin:0 0 14px;

    font-size:20px;
}


.prayer-title{
    margin:0 0 13px;

    font-size:20px;
}


.candle-title::before,
.candle-title::after,
.prayer-title::before,
.prayer-title::after{

    content:"✦";

    color:#996633;

    margin:0 8px;
}


/* =====================================================
   BUTTONS
===================================================== */

.light-button,
.offer-button{

    appearance:none;

    border:
        1px solid #865c35;

    border-radius:0;

    background:
        linear-gradient(
            #fff8d9,
            #e9c88c
        );

    box-shadow:
        inset 1px 1px white,

        inset -1px -1px
        rgba(91,57,31,.28),

        0 2px 3px
        rgba(71,45,68,.12);

    color:#503326;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    text-shadow:
        1px 1px
        rgba(255,255,255,.7);

    transition:
        box-shadow .2s,
        background .2s,
        transform .1s;
}


.light-button{

    padding:
        9px 27px;

    font-size:13px;
}


.offer-button{

    padding:
        9px 25px;

    font-size:13px;
}


.light-button:hover,
.offer-button:hover{

    background:
        linear-gradient(
            #fffbe3,
            #efd099
        );

    box-shadow:
        0 0 11px
        rgba(255,204,99,.7),

        inset 1px 1px white;
}


.light-button:active,
.offer-button:active{

    transform:
        translateY(1px);
}


/* =====================================================
   CANDLE MESSAGE
===================================================== */

.candle-message{

    min-height:16px;

    margin-top:10px;

    color:#4d3657;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:11px;

    font-weight:bold;

    text-align:center;
}


/* =====================================================
   CANDLE LIGHT EFFECT
===================================================== */

.candle-light{

    position:absolute;

    z-index:5;

    left:42%;
    top:45%;

    width:16%;

    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,

            rgba(255,250,201,.6),

            rgba(255,216,120,.22) 38%,

            transparent 72%
        );

    transition:
        opacity .8s ease;

    animation:
        candleGlow 1.8s
        ease-in-out infinite alternate;
}


.candle-light.lit{
    opacity:.85;
}


@keyframes candleGlow{

    from{
        transform:scale(.9);
    }

    to{
        transform:scale(1.08);
    }

}


/* =====================================================
   LEAVE A PRAYER PANEL
===================================================== */

.prayer-panel{

    position:absolute;

    z-index:10;

    left:18.5%;
    top:69%;

    width:63%;
    height:19.5%;

    display:flex;

    flex-direction:column;

    align-items:center;

    font-family:
        "Courier New",
        Courier,
        monospace;
}


/* =====================================================
   PRAYER FORM
===================================================== */

#prayerForm{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
}


/* =====================================================
   TEXTAREA
===================================================== */

textarea{

    display:block;

    width:100%;

    height:150px;

    padding:13px;

    resize:none;

    outline:none;

    border:
        1px solid #684b73;

    border-radius:0;

    background:
        rgba(255,246,244,.57);

    box-shadow:
        inset 1px 1px
        rgba(255,255,255,.88),

        0 0 4px
        rgba(83,54,91,.14);

    color:#3d2947;

    caret-color:#805329;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:14px;

    font-weight:500;

    line-height:1.55;
}


/*
No placeholder.
Prayer box opens completely blank.
*/

textarea:focus{

    border-color:#8b5b31;

    background:
        rgba(255,249,242,.67);

    box-shadow:
        0 0 7px
        rgba(255,205,108,.42),

        inset 1px 1px white;
}


/* =====================================================
   FORM BOTTOM
===================================================== */

.form-bottom{

    position:relative;

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-top:12px;
}


.counter{

    position:absolute;

    right:0;

    color:#493451;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:10px;

    font-weight:bold;
}


/* =====================================================
   PRIVACY TEXT
===================================================== */

.privacy{

    width:96%;

    margin:
        14px auto 0;

    color:#432d4c;

    text-align:center;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:11px;

    font-weight:bold;

    line-height:1.55;

    text-shadow:
        1px 1px
        rgba(255,255,255,.85);
}


/* =====================================================
   PHONE

   On phones, use the full width of the device.
===================================================== */

@media(max-width:700px){

    .shrine{
        width:100vw;
    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    .star,
    .starburst,
    .waterfall::before,
    .waterfall::after,
    .mist,
    .pool::before,
    .candle-light{

        animation:none !important;
    }

}

</style>
</head>


<body>


<main class="shrine">


<!-- =================================================
     BACKGROUND ART
================================================= -->

<img
    class="art"
    src="prayer-altar-shrine.png"
    alt="Pastel pixel-art prayer shrine centred on Jesus with candles, flowers, stars, waterfalls and Matthew 11:28."
>


<!-- =================================================
     TWINKLING STARS
================================================= -->

<i class="star s1"></i>
<i class="star s2"></i>
<i class="star s3"></i>
<i class="star s4"></i>
<i class="star s5"></i>
<i class="star s6"></i>
<i class="star s7"></i>
<i class="star s8"></i>
<i class="star s9"></i>
<i class="star s10"></i>
<i class="star s11"></i>
<i class="star s12"></i>

<i class="starburst sb1"></i>
<i class="starburst sb2"></i>
<i class="starburst sb3"></i>


<!-- =================================================
     WATERFALLS
================================================= -->

<div class="waterfall left"></div>
<div class="waterfall right"></div>

<div class="mist left"></div>
<div class="mist right"></div>


<!-- =================================================
     POOL SHIMMER
================================================= -->

<div class="pool"></div>


<!-- =================================================
     CANDLE LIGHT
================================================= -->

<div
    class="candle-light"
    id="candleLight">
</div>


<!-- =================================================
     LIGHT A CANDLE
================================================= -->

<section class="candle-panel">


    <h2 class="candle-title">
        Light a Candle
    </h2>


    <button
        type="button"
        class="light-button"
        id="lightButton">

        LIGHT CANDLE

    </button>


    <div
        class="candle-message"
        id="candleMessage">
    </div>


</section>


<!-- =================================================
     LEAVE A PRAYER
================================================= -->

<section class="prayer-panel">


    <h2 class="prayer-title">
        Leave a Prayer
    </h2>


    <form id="prayerForm">


        <textarea
            id="prayer"
            name="prayer"
            maxlength="5000"
            required
            aria-label="Write your prayer intention"></textarea>


        <div class="form-bottom">


            <span class="counter">

                <span id="count">0</span>
                / 5000

            </span>


            <button
                type="submit"
                class="offer-button">

                OFFER PRAYER

            </button>


        </div>


    </form>


    <p class="privacy">
        Your prayer intention will be received privately and prayed over personally.
        Prayers are not displayed publicly
    </p>


</section>


</main>


<script>

/* =====================================================
   LIGHT A CANDLE
===================================================== */

const lightButton =
    document.getElementById("lightButton");

const candleLight =
    document.getElementById("candleLight");

const candleMessage =
    document.getElementById("candleMessage");


lightButton.addEventListener(
    "click",
    () => {

        candleLight
            .classList
            .add("lit");


        candleMessage.textContent =
            "✦ YOUR CANDLE HAS BEEN LIT ✦";

    }
);


/* =====================================================
   CHARACTER COUNTER
===================================================== */

const prayer =
    document.getElementById("prayer");

const count =
    document.getElementById("count");


prayer.addEventListener(
    "input",
    () => {

        count.textContent =
            prayer.value.length;

    }
);


/* =====================================================
   PRAYER SUBMISSION

   Still disabled while we finish the appearance.
===================================================== */

document
    .getElementById("prayerForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();

        }
    );

</script>


</body>
</html>
