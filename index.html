<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Prayer Altar</title>

<style>

/* =====================================================
   PAGE
===================================================== */

*{
    box-sizing:border-box;
}

html{
    margin:0;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% 25%,
            #fff8f5 0%,
            #eee3f6 50%,
            #ddd2ed 100%
        );
}


/* =====================================================
   SHRINE
===================================================== */

.shrine{
    position:relative;

    width:min(700px,100vw);
    aspect-ratio:2 / 3;

    flex:none;
    overflow:hidden;

    box-shadow:
        0 0 35px rgba(111,83,133,.12);
}

.art{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    user-select:none;
    pointer-events:none;

    z-index:1;
}


/* =====================================================
   JESUS — HALO GLOW
===================================================== */

.halo-glow{
    position:absolute;
    z-index:2;

    left:36.5%;
    top:16.2%;

    width:27%;
    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,236,.38) 0%,
            rgba(255,239,172,.28) 25%,
            rgba(255,207,126,.14) 48%,
            rgba(239,210,255,.08) 65%,
            transparent 76%
        );

    filter:blur(3px);
    mix-blend-mode:screen;

    animation:
        haloPulse 4.5s ease-in-out infinite;
}

@keyframes haloPulse{

    0%,100%{
        opacity:.48;
        transform:scale(.94);
    }

    50%{
        opacity:.92;
        transform:scale(1.08);
    }
}


/* =====================================================
   JESUS — CHEST GLOW
===================================================== */

.chest-glow{
    position:absolute;
    z-index:3;

    left:43.5%;
    top:30%;

    width:13%;
    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,240,.78) 0%,
            rgba(255,238,171,.42) 20%,
            rgba(255,201,146,.19) 43%,
            rgba(238,206,255,.08) 61%,
            transparent 76%
        );

    filter:blur(4px);
    mix-blend-mode:screen;

    animation:
        chestPulse 3.3s ease-in-out infinite;
}

@keyframes chestPulse{

    0%,100%{
        opacity:.36;
        transform:scale(.82);
    }

    50%{
        opacity:.88;
        transform:scale(1.17);
    }
}


/* =====================================================
   TWINKLING STARS
===================================================== */

.star{
    position:absolute;

    z-index:4;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#fffce9;

    pointer-events:none;

    opacity:.15;

    box-shadow:
        0 0 3px #fff,
        0 0 6px #ffe8a8,
        0 0 10px rgba(235,210,255,.85);

    animation:
        twinkle 3.6s ease-in-out infinite;
}


/* LEFT SKY */

.s1  {left:4%;  top:4%;  animation-delay:-.2s;}
.s2  {left:9%;  top:7%;  animation-delay:-1.8s;}
.s3  {left:13%; top:3%;  animation-delay:-2.7s;}
.s4  {left:17%; top:9%;  animation-delay:-.9s;}
.s5  {left:7%;  top:13%; animation-delay:-3.1s;}
.s6  {left:14%; top:15%; animation-delay:-1.3s;}
.s7  {left:21%; top:5%;  animation-delay:-2.2s;}
.s8  {left:24%; top:12%; animation-delay:-.5s;}
.s9  {left:4%;  top:19%; animation-delay:-2.9s;}
.s10 {left:18%; top:20%; animation-delay:-1.7s;}


/* CENTRAL SKY */

.s11 {left:37%; top:7%;  animation-delay:-.7s;}
.s12 {left:42%; top:12%; animation-delay:-2.5s;}
.s13 {left:47%; top:5%;  animation-delay:-1.1s;}
.s14 {left:53%; top:10%; animation-delay:-3.2s;}
.s15 {left:58%; top:6%;  animation-delay:-1.9s;}
.s16 {left:62%; top:13%; animation-delay:-.4s;}
.s17 {left:39%; top:17%; animation-delay:-2.8s;}
.s18 {left:61%; top:18%; animation-delay:-1.4s;}


/* RIGHT SKY */

.s19 {left:76%; top:5%;  animation-delay:-2.1s;}
.s20 {left:82%; top:9%;  animation-delay:-.8s;}
.s21 {left:87%; top:4%;  animation-delay:-3s;}
.s22 {left:92%; top:12%; animation-delay:-1.5s;}
.s23 {left:78%; top:16%; animation-delay:-2.6s;}
.s24 {left:89%; top:19%; animation-delay:-.6s;}
.s25 {left:96%; top:6%;  animation-delay:-1.9s;}
.s26 {left:72%; top:12%; animation-delay:-3.3s;}


@keyframes twinkle{

    0%,65%,100%{
        opacity:.1;
        transform:scale(.45);
    }

    77%{
        opacity:.55;
        transform:scale(1);
    }

    84%{
        opacity:1;
        transform:scale(2);
    }

    91%{
        opacity:.25;
        transform:scale(.7);
    }
}


/* =====================================================
   STARBURSTS
===================================================== */

.starburst{
    position:absolute;

    z-index:4;

    width:2px;
    height:14px;

    pointer-events:none;

    opacity:.1;

    background:
        linear-gradient(
            transparent,
            #fffce6,
            transparent
        );

    filter:
        drop-shadow(0 0 3px white)
        drop-shadow(0 0 7px #ffe4a2);

    animation:
        burst 5.5s ease-in-out infinite;
}

.starburst::after{
    content:"";

    position:absolute;

    width:14px;
    height:2px;

    left:-6px;
    top:6px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #fffce6,
            transparent
        );
}

.sb1{left:13.5%; top:5%;  animation-delay:-1s;}
.sb2{left:87%;   top:7%;  animation-delay:-3.4s;}
.sb3{left:57%;   top:11%; animation-delay:-2.1s;}
.sb4{left:8%;    top:16%; animation-delay:-4.2s;}
.sb5{left:91%;   top:16%; animation-delay:-.7s;}
.sb6{left:41%;   top:15%; animation-delay:-2.8s;}

@keyframes burst{

    0%,72%,100%{
        opacity:.05;
        transform:scale(.5);
    }

    82%{
        opacity:1;
        transform:scale(1.5);
    }

    91%{
        opacity:.15;
        transform:scale(.7);
    }
}


/* =====================================================
   WATERFALLS
===================================================== */

.waterfall{
    position:absolute;

    z-index:3;

    overflow:hidden;
    pointer-events:none;

    opacity:.34;
    mix-blend-mode:screen;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 7%,
            black 91%,
            transparent 100%
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 7%,
            black 91%,
            transparent 100%
        );
}


/* LEFT WATERFALL */

.waterfall.left{
    left:9.1%;
    top:33.1%;

    width:7.4%;
    height:9.4%;
}


/* RIGHT WATERFALL */

.waterfall.right{
    right:7.8%;
    top:33.1%;

    width:7.4%;
    height:9.4%;
}


.waterfall::before{
    content:"";

    position:absolute;

    left:0;
    top:-60%;

    width:100%;
    height:180%;

    background:
        repeating-linear-gradient(
            to bottom,

            transparent 0px,
            rgba(255,255,255,.10) 5px,
            rgba(218,239,255,.30) 8px,
            rgba(255,255,255,.48) 10px,
            rgba(220,238,255,.13) 13px,
            transparent 21px
        );

    animation:
        waterFall 1.8s linear infinite;
}


.waterfall::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,

            transparent 0%,
            transparent 22%,

            rgba(255,255,255,.25) 28%,

            transparent 34%,
            transparent 57%,

            rgba(230,245,255,.20) 63%,

            transparent 70%
        );

    animation:
        waterSparkle 2.3s ease-in-out infinite alternate;
}


.waterfall.right::before{
    animation-duration:2.05s;
    animation-delay:-.7s;
}


@keyframes waterFall{

    from{
        transform:translateY(-8%);
    }

    to{
        transform:translateY(36%);
    }
}


@keyframes waterSparkle{

    from{
        opacity:.18;
    }

    to{
        opacity:.7;
    }
}


/* =====================================================
   WATERFALL MIST
===================================================== */

.mist{
    position:absolute;

    z-index:3;

    width:9%;
    height:2.5%;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.38),
            rgba(225,240,255,.13) 48%,
            transparent 72%
        );

    mix-blend-mode:screen;

    animation:
        mistMove 4s ease-in-out infinite alternate;
}


.mist.left{
    left:8.3%;
    top:40.3%;
}


.mist.right{
    right:7%;
    top:40.3%;

    animation-delay:-2s;
}


@keyframes mistMove{

    from{
        opacity:.08;
        transform:
            translateX(-3%)
            scale(.92);
    }

    to{
        opacity:.32;
        transform:
            translateX(4%)
            scale(1.06);
    }
}


/* =====================================================
   CANDLE FLAMES
===================================================== */

.flame{
    position:absolute;

    z-index:6;

    width:5px;
    height:10px;

    margin-left:-2.5px;
    margin-top:-9px;

    border-radius:
        55% 55% 48% 48%;

    pointer-events:none;

    transform-origin:
        50% 100%;

    background:
        radial-gradient(
            ellipse at 50% 70%,

            #ffffff 0%,
            #fffbd0 20%,
            #ffd86e 43%,
            #f6a14a 65%,
            transparent 76%
        );

    filter:
        drop-shadow(0 0 2px #fff7bd)
        drop-shadow(0 0 4px #ffd56c)
        drop-shadow(0 0 7px rgba(255,180,72,.65));

    animation:
        flameFlicker 1.15s ease-in-out infinite alternate;
}


.flame::after{
    content:"";

    position:absolute;

    left:-6px;
    top:-4px;

    width:17px;
    height:19px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,225,125,.17),
            transparent 68%
        );

    filter:blur(2px);
}


/* different flicker timing */

.f2{
    animation-delay:-.37s;
    animation-duration:.93s;
}

.f3{
    animation-delay:-.74s;
    animation-duration:1.31s;
}

.f4{
    animation-delay:-.19s;
    animation-duration:1.08s;
}

.f5{
    animation-delay:-.91s;
    animation-duration:1.42s;
}

.f6{
    animation-delay:-.52s;
    animation-duration:.98s;
}

.f7{
    animation-delay:-1.1s;
    animation-duration:1.26s;
}

.f8{
    animation-delay:-.27s;
    animation-duration:1.37s;
}

.f9{
    animation-delay:-.66s;
    animation-duration:1.02s;
}

.f10{
    animation-delay:-.43s;
    animation-duration:1.48s;
}

.f11{
    animation-delay:-.83s;
    animation-duration:1.19s;
}

.f12{
    animation-delay:-.13s;
    animation-duration:.91s;
}

.f13{
    animation-delay:-1.03s;
    animation-duration:1.33s;
}

.f14{
    animation-delay:-.58s;
    animation-duration:1.09s;
}

.f15{
    animation-delay:-.31s;
    animation-duration:1.41s;
}

.f16{
    animation-delay:-.72s;
    animation-duration:1.28s;
}


@keyframes flameFlicker{

    0%{
        opacity:.75;

        transform:
            scale(.82,1.08)
            rotate(-3deg);
    }

    30%{
        opacity:1;

        transform:
            scale(1.03,.93)
            rotate(2deg);
    }

    65%{
        opacity:.84;

        transform:
            scale(.9,1.12)
            rotate(-1deg);
    }

    100%{
        opacity:1;

        transform:
            scale(1.06,.96)
            rotate(3deg);
    }
}


/* =====================================================
   CANDLE POSITIONS
===================================================== */


/* TWO TALL CANDLES BESIDE JESUS */

.f1{
    left:27.65%;
    top:29.25%;
}

.f2{
    left:72.36%;
    top:29.25%;
}


/* LEFT SIDE OF ALTAR */

.f3{
    left:34.15%;
    top:40.4%;
}

.f4{
    left:38.65%;
    top:45.1%;
}

.f5{
    left:42.25%;
    top:46.2%;
}


/* CENTRAL ALTAR */

.f6{
    left:49.55%;
    top:44.7%;
}

.f7{
    left:56.35%;
    top:47.3%;
}

.f8{
    left:60.8%;
    top:48.5%;
}


/* RIGHT SIDE */

.f9{
    left:65.45%;
    top:46.7%;
}

.f10{
    left:69.45%;

}

    left:72.65%;

}

}

}

.f14{
    left:6.55%;
    top:72.5%;
}

.f15{
    left:15.75%;
    top:86.2%;
}


/* LOWER RIGHT */

.f16{
    left:79.25%;
    top:88.2%;
}


/* =====================================================
   VISITOR CANDLE GLOW
===================================================== */

.visitor-light{
    position:absolute;

    z-index:5;

    left:43%;
    top:44%;

    width:14%;
    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(255,255,220,.65),
            rgba(255,216,115,.3) 35%,
            transparent 72%
        );

    filter:blur(2px);

    mix-blend-mode:screen;

    transition:
        opacity 1s ease;

    animation:
        visitorGlow 2s ease-in-out infinite alternate;
}


.visitor-light.lit{
    opacity:1;
}


@keyframes visitorGlow{

    from{
        transform:scale(.9);
    }

    to{
        transform:scale(1.12);
    }
}


/* =====================================================
   LIGHT A CANDLE PANEL
===================================================== */

.candle-panel{
    position:absolute;

    z-index:10;

    left:14%;
    top:57.2%;

    width:72%;
    height:9.5%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-family:
        "Courier New",
        Courier,
        monospace;
}


/* =====================================================
   TITLES
===================================================== */

.candle-title,
.prayer-title{

    color:#493154;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:2px;

    text-shadow:
        1px 1px rgba(255,255,255,.95),
        0 0 4px rgba(255,255,255,.8);
}


.candle-title{
    margin:0 0 14px;
    font-size:20px;
}


.prayer-title{
    margin:0 0 13px;
    font-size:20px;
}


.candle-title::before,
.candle-title::after,
.prayer-title::before,
.prayer-title::after{

    content:"✦";

    color:#996633;

    margin:0 8px;
}


/* =====================================================
   BUTTONS
===================================================== */

.light-button,
.offer-button{

    appearance:none;

    border:1px solid #865c35;

    border-radius:0;

    background:
        linear-gradient(
            #fff8d9,
            #e9c88c
        );

    box-shadow:
        inset 1px 1px white,
        inset -1px -1px rgba(91,57,31,.28),
        0 2px 3px rgba(71,45,68,.12);

    color:#503326;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    text-shadow:
        1px 1px rgba(255,255,255,.7);

    transition:
        box-shadow .2s,
        background .2s,
        transform .1s;
}


.light-button{
    padding:9px 27px;
    font-size:13px;
}


.offer-button{
    padding:9px 25px;
    font-size:13px;
}


.light-button:hover,
.offer-button:hover{

    background:
        linear-gradient(
            #fffbe3,
            #efd099
        );

    box-shadow:
        0 0 11px rgba(255,204,99,.7),
        inset 1px 1px white;
}


.light-button:active,
.offer-button:active{
    transform:translateY(1px);
}


/* =====================================================
   CANDLE MESSAGE
===================================================== */

.candle-message{
    min-height:16px;

    margin-top:10px;

    color:#4d3657;

    font-size:11px;
    font-weight:bold;

    text-align:center;
}


/* =====================================================
   PRAYER PANEL
===================================================== */

.prayer-panel{
    position:absolute;

    z-index:10;

    left:18.5%;
    top:69%;

    width:63%;
    height:19.5%;

    display:flex;
    flex-direction:column;
    align-items:center;

    font-family:
        "Courier New",
        Courier,
        monospace;
}


#prayerForm{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
}


/* =====================================================
   TEXTAREA
===================================================== */

textarea{
    display:block;

    width:100%;
    height:150px;

    padding:13px;

    resize:none;
    outline:none;

    border:1px solid #684b73;

    border-radius:0;

    background:
        rgba(255,246,244,.57);

    box-shadow:
        inset 1px 1px rgba(255,255,255,.88),
        0 0 4px rgba(83,54,91,.14);

    color:#3d2947;

    caret-color:#805329;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:14px;
    font-weight:500;

    line-height:1.55;
}


textarea:focus{
    border-color:#8b5b31;

    background:
        rgba(255,249,242,.67);

    box-shadow:
        0 0 7px rgba(255,205,108,.42),
        inset 1px 1px white;
}


/* =====================================================
   FORM BOTTOM
===================================================== */

.form-bottom{
    position:relative;

    width:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    margin-top:12px;
}


.counter{
    position:absolute;

    right:0;

    color:#493451;

    font-size:10px;
    font-weight:bold;
}


/* =====================================================
   PRIVACY
===================================================== */

.privacy{
    width:96%;

    margin:14px auto 0;

    color:#432d4c;

    text-align:center;

    font-size:11px;
    font-weight:bold;

    line-height:1.55;

    text-shadow:
        1px 1px rgba(255,255,255,.85);
}


/* =====================================================
   LOWER WATER SHIMMER
===================================================== */

.pool-shimmer{
    position:absolute;

    z-index:3;

    left:20%;
    bottom:0;

    width:60%;
    height:8%;

    overflow:hidden;

    pointer-events:none;

    opacity:.38;

    mix-blend-mode:screen;
}


.pool-shimmer::before{
    content:"";

    position:absolute;

    left:-70%;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            105deg,

            transparent,

            rgba(255,255,255,.06),

            rgba(255,231,171,.35),

            rgba(225,215,255,.24),

            transparent
        );

    animation:
        poolShimmer 8s ease-in-out infinite;
}


@keyframes poolShimmer{

    0%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(240%);
    }

    100%{
        transform:translateX(0);
    }
}


/* =====================================================
   PHONE
===================================================== */

@media(max-width:700px){

    .shrine{
        width:100vw;
    }

    .flame{
        width:4px;
        height:8px;

        margin-left:-2px;
        margin-top:-7px;
    }
}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    .star,
    .starburst,
    .waterfall::before,
    .waterfall::after,
    .mist,
    .flame,
    .halo-glow,
    .chest-glow,
    .visitor-light,
    .pool-shimmer::before{

        animation:none !important;
    }
}

</style>
</head>

<!-- ===================================================
     VISITOR CANDLE
=================================================== -->

<div
    class="visitor-light"
    id="visitorLight">
</div>


<!-- ===================================================
     LIGHT A CANDLE
=================================================== -->

<section class="candle-panel">

    <h2 class="candle-title">
        Light a Candle
    </h2>

    <button
        type="button"
        class="light-button"
        id="lightButton">

        LIGHT CANDLE

    </button>

    <div
        class="candle-message"
        id="candleMessage">
    </div>

</section>


<!-- ===================================================
     LEAVE A PRAYER
=================================================== -->

<section class="prayer-panel">

    <h2 class="prayer-title">
        Leave a Prayer
    </h2>

    <form id="prayerForm">

        <textarea
            id="prayer"
            name="prayer"
            maxlength="5000"
            required
            aria-label="Write your prayer intention"></textarea>

        <div class="form-bottom">

            <span class="counter">
                <span id="count">0</span> / 5000
            </span>

            <button
                type="submit"
                class="offer-button">

                OFFER PRAYER

            </button>

        </div>

    </form>

    <p class="privacy">
        Your prayer intention will be received privately and prayed over personally.
        Prayers are not displayed publicly
    </p>

</section>


</main>


<script>

/* =====================================================
   LIGHT A CANDLE
===================================================== */

const lightButton =
    document.getElementById("lightButton");

const visitorLight =
    document.getElementById("visitorLight");

const candleMessage =
    document.getElementById("candleMessage");


lightButton.addEventListener(
    "click",
    () => {

        visitorLight.classList.add("lit");

        candleMessage.textContent =
            "✦ YOUR CANDLE HAS BEEN LIT ✦";

        lightButton.textContent =
            "CANDLE LIT";
    }
);


/* =====================================================
   CHARACTER COUNTER
===================================================== */

const prayer =
    document.getElementById("prayer");

const count =
    document.getElementById("count");


prayer.addEventListener(
    "input",
    () => {

        count.textContent =
            prayer.value.length;
    }
);


/* =====================================================
   PRAYER SUBMISSION

   Deliberately disabled until we reconnect Supabase.
===================================================== */

document
    .getElementById("prayerForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();
        }
    );

</script>

</body>
</html>
