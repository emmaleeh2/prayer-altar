<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Prayer Altar</title>

<style>

/* =========================================================
   BASIC PAGE
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 25%,
            #fff8f5 0%,
            #eee3f6 50%,
            #ddd2ed 100%
        );
}


/* =========================================================
   SHRINE
========================================================= */

.shrine{
    position:relative;

    width:700px;
    max-width:100%;

    aspect-ratio:2 / 3;

    margin:0 auto;

    overflow:hidden;

    box-shadow:
        0 0 35px rgba(111,83,133,.12);
}


.art{
    position:absolute;
    inset:0;

    z-index:1;

    display:block;

    width:100%;
    height:100%;

    object-fit:fill;

    pointer-events:none;
    user-select:none;
}


/* =========================================================
   JESUS — HALO GLOW
========================================================= */

.halo-glow{
    position:absolute;

    z-index:2;

    left:37%;
    top:17%;

    width:26%;
    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,240,.48) 0%,
            rgba(255,238,164,.28) 27%,
            rgba(255,207,130,.12) 50%,
            transparent 73%
        );

    filter:blur(4px);

    mix-blend-mode:screen;

    animation:
        haloPulse 4.5s ease-in-out infinite;
}


@keyframes haloPulse{

    0%,
    100%{
        opacity:.42;
        transform:scale(.94);
    }

    50%{
        opacity:.95;
        transform:scale(1.08);
    }

}


/* =========================================================
   JESUS — CHEST GLOW
========================================================= */

.chest-glow{
    position:absolute;

    z-index:3;

    left:43%;
    top:31.3%;

    width:14%;
    aspect-ratio:1;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,245,.9) 0%,
            rgba(255,239,166,.52) 20%,
            rgba(255,194,118,.23) 43%,
            transparent 72%
        );

    filter:blur(5px);

    mix-blend-mode:screen;

    animation:
        chestPulse 3s ease-in-out infinite;
}


@keyframes chestPulse{

    0%,
    100%{
        opacity:.40;
        transform:scale(.82);
    }

    50%{
        opacity:1;
        transform:scale(1.18);
    }

}


/* =========================================================
   FLICKERING DECORATIVE CANDLES
========================================================= */

.flame{
    position:absolute;

    z-index:7;

    width:6px;
    height:14px;

    margin-left:-3px;
    margin-top:-12px;

    pointer-events:none;

    border-radius:
        60% 60% 55% 55% /
        75% 75% 40% 40%;

    transform-origin:50% 100%;

    background:
        radial-gradient(
            ellipse at 50% 70%,
            #ffffff 0%,
            #fffbd0 18%,
            #ffe16e 40%,
            #ffad45 63%,
            rgba(255,142,42,.7) 72%,
            transparent 78%
        );

    box-shadow:
        0 0 3px rgba(255,255,220,.95),
        0 0 7px rgba(255,210,91,.9),
        0 0 13px rgba(255,166,64,.55);

    animation:
        flameDance 1s ease-in-out infinite alternate;
}


.flame::after{
    content:"";

    position:absolute;

    left:50%;
    top:60%;

    width:25px;
    height:25px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,225,120,.32),
            rgba(255,190,75,.12) 42%,
            transparent 70%
        );

    filter:blur(2px);
}


@keyframes flameDance{

    0%{
        opacity:.72;

        transform:
            translateX(-1px)
            scale(.78,1.15)
            rotate(-5deg);
    }

    22%{
        opacity:1;

        transform:
            translateX(1px)
            scale(1.08,.88)
            rotate(4deg);
    }

    48%{
        opacity:.80;

        transform:
            translateX(0)
            scale(.86,1.22)
            rotate(-2deg);
    }

    73%{
        opacity:1;

        transform:
            translateX(-1px)
            scale(1.10,.92)
            rotate(5deg);
    }

    100%{
        opacity:.82;

        transform:
            translateX(1px)
            scale(.83,1.17)
            rotate(-4deg);
    }

}


/* =========================================================
   CANDLE FLAMES — CORRECTED POSITIONS
========================================================= */

/* tall left candle beside Jesus */
.f1{
    left:27.75%;
    top:31.65%;

    width:7px;
    height:16px;

    animation-duration:.92s;
}


/* tall right candle beside Jesus */
.f2{
    left:72.35%;
    top:31.65%;

    width:7px;
    height:16px;

    animation-duration:1.08s;
    animation-delay:-.48s;
}


/* altar candles */

.f3{
    left:34.15%;
    top:47.15%;

    animation-duration:.83s;
    animation-delay:-.31s;
}


.f4{
    left:42.25%;
    top:46.75%;

    animation-duration:1.17s;
    animation-delay:-.71s;
}


.f5{
    left:49.75%;
    top:46.25%;

    animation-duration:.89s;
    animation-delay:-.22s;
}


.f6{
    left:56.65%;
    top:46.85%;

    animation-duration:1.13s;
    animation-delay:-.82s;
}


.f7{
    left:62.75%;
    top:46.65%;

    animation-duration:.96s;
    animation-delay:-.44s;
}


.f8{
    left:67.55%;
    top:47.15%;

    animation-duration:1.21s;
    animation-delay:-.67s;
}


/* =========================================================
   TWINKLING STARS
========================================================= */

.twinkle{
    position:absolute;

    z-index:6;

    width:3px;
    height:3px;

    margin-left:-1px;
    margin-top:-1px;

    border-radius:50%;

    pointer-events:none;

    background:#fff;

    box-shadow:
        0 0 3px #fff,
        0 0 7px #fff0ae,
        0 0 11px rgba(226,205,255,.9);

    opacity:0;

    animation:
        twinkle 3.6s ease-in-out infinite;
}


@keyframes twinkle{

    0%,
    65%,
    100%{
        opacity:0;
        transform:scale(.3);
    }

    74%{
        opacity:.5;
        transform:scale(.8);
    }

    82%{
        opacity:1;
        transform:scale(2.2);
    }

    90%{
        opacity:.35;
        transform:scale(.7);
    }

}


.t1{ left:9%; top:5%; animation-delay:-.4s; }
.t2{ left:14%; top:9%; animation-delay:-1.8s; }
.t3{ left:21%; top:4%; animation-delay:-2.7s; }
.t4{ left:28%; top:12%; animation-delay:-.8s; }
.t5{ left:37%; top:6%; animation-delay:-2.2s; }
.t6{ left:43%; top:12%; animation-delay:-1.1s; }
.t7{ left:56%; top:7%; animation-delay:-3.1s; }
.t8{ left:63%; top:14%; animation-delay:-.5s; }
.t9{ left:73%; top:5%; animation-delay:-2.5s; }
.t10{ left:81%; top:10%; animation-delay:-1.4s; }
.t11{ left:88%; top:4%; animation-delay:-3.3s; }
.t12{ left:95%; top:13%; animation-delay:-.9s; }
.t13{ left:6%; top:17%; animation-delay:-2.9s; }
.t14{ left:18%; top:16%; animation-delay:-.3s; }
.t15{ left:31%; top:18%; animation-delay:-1.9s; }
.t16{ left:68%; top:17%; animation-delay:-2.4s; }
.t17{ left:82%; top:18%; animation-delay:-.7s; }
.t18{ left:94%; top:19%; animation-delay:-3.5s; }


/* =========================================================
   STAR GLINTS
========================================================= */

.glint{
    position:absolute;

    z-index:6;

    width:2px;
    height:14px;

    pointer-events:none;

    opacity:0;

    background:
        linear-gradient(
            transparent,
            white,
            transparent
        );

    filter:
        drop-shadow(0 0 4px white)
        drop-shadow(0 0 7px #ffe89d);

    animation:
        glint 5s ease-in-out infinite;
}


.glint::after{
    content:"";

    position:absolute;

    width:14px;
    height:2px;

    left:-6px;
    top:6px;

    background:
        linear-gradient(
            90deg,
            transparent,
            white,
            transparent
        );
}


.g1{
    left:13.5%;
    top:5%;
    animation-delay:-1s;
}

.g2{
    left:87%;
    top:7%;
    animation-delay:-3.2s;
}

.g3{
    left:57%;
    top:12%;
    animation-delay:-2s;
}

.g4{
    left:29%;
    top:15%;
    animation-delay:-4.1s;
}


@keyframes glint{

    0%,
    74%,
    100%{
        opacity:0;
        transform:scale(.4);
    }

    84%{
        opacity:1;
        transform:scale(1.5);
    }

    92%{
        opacity:.2;
        transform:scale(.7);
    }

}


/* =========================================================
   PRAYER AREA
========================================================= */

.prayer-panel{
    position:absolute;

    z-index:20;

    left:18%;
    top:57%;

    width:64%;
    height:35%;

    font-family:
        "Courier New",
        Courier,
        monospace;
}


/* =========================================================
   LEAVE A PRAYER
========================================================= */

.prayer-title{
    position:absolute;

    top:3%;
    left:0;

    width:100%;

    margin:0;

    text-align:center;

    color:#493154;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:20px;
    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:2px;

    text-shadow:
        1px 1px rgba(255,255,255,.95),
        0 0 4px rgba(255,255,255,.8);
}


.prayer-title::before,
.prayer-title::after{
    content:"✦";

    color:#996633;

    margin:0 8px;
}


/* =========================================================
   FORM
========================================================= */

#prayerForm{
    position:absolute;

    left:0;
    top:24%;

    width:100%;

    margin:0;
}


/* =========================================================
   TEXTAREA
========================================================= */

textarea{
    display:block;

    width:100%;
    height:120px;

    margin:0;

    padding:13px;

    resize:none;
    outline:none;

    border:1px solid #000;
    border-radius:0;

    background:#fffaf4;

    color:#2d2230;
    caret-color:#000;

    box-shadow:none;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:14px;
    font-weight:500;

    line-height:1.5;
}


textarea:focus{
    border:1px solid #000;

    background:#fffdf9;

    outline:none;
    box-shadow:none;
}


/* =========================================================
   FORM BOTTOM
========================================================= */

.form-bottom{
    position:relative;

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    margin-top:7px;
}


/* =========================================================
   COUNTER
========================================================= */

.counter{
    position:static;

    align-self:flex-end;

    margin:0 0 10px 0;

    color:#35293a;

    font-size:10px;
    font-weight:bold;
}


/* =========================================================
   OFFER PRAYER BUTTON
========================================================= */

.offer-button{
    appearance:none;

    padding:9px 25px;

    border:1px solid #865c35;
    border-radius:0;

    background:
        linear-gradient(
            #fff8d9,
            #e9c88c
        );

    box-shadow:
        inset 1px 1px white,
        inset -1px -1px rgba(91,57,31,.28),
        0 2px 3px rgba(71,45,68,.12);

    color:#503326;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:13px;
    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    text-shadow:
        1px 1px rgba(255,255,255,.7);

    transition:
        box-shadow .2s,
        background .2s,
        transform .1s;
}


.offer-button:hover{
    background:
        linear-gradient(
            #fffbe3,
            #efd099
        );

    box-shadow:
        0 0 11px rgba(255,204,99,.7),
        inset 1px 1px white;
}


.offer-button:active{
    transform:translateY(1px);
}


/* =========================================================
   PRIVACY MESSAGE
========================================================= */

.privacy{
    position:absolute;

    left:5%;
    top:76%;

    width:90%;

    margin:0;

    color:#432d4c;

    text-align:center;

    font-size:11px;
    font-weight:bold;

    line-height:1.55;

    text-shadow:
        1px 1px rgba(255,255,255,.9);
}


/* =========================================================
   MOBILE

   KEEP THE ENTIRE SHRINE PROPORTIONAL.
========================================================= */

@media(max-width:700px){

    body{
        width:100%;
        min-width:0;
    }


    .shrine{
        width:100vw;
        max-width:100vw;

        margin:0;

        aspect-ratio:2 / 3;
    }


    .prayer-title{
        font-size:
            clamp(12px,3.7vw,20px);

        letter-spacing:1px;
    }


    .prayer-title::before,
    .prayer-title::after{
        margin:0 4px;
    }


    textarea{
        height:
            clamp(68px,17vw,120px);

        padding:
            clamp(6px,1.8vw,13px);

        font-size:
            clamp(9px,2.8vw,14px);
    }


    .form-bottom{
        margin-top:
            clamp(3px,1vw,7px);
    }


    .counter{
        margin-bottom:
            clamp(4px,1.3vw,10px);

        font-size:
            clamp(7px,1.8vw,10px);
    }


    .offer-button{
        padding:
            clamp(5px,1.5vw,9px)
            clamp(12px,4vw,25px);

        font-size:
            clamp(9px,2.5vw,13px);

        letter-spacing:1px;
    }


    .privacy{
        font-size:
            clamp(8px,2.1vw,11px);

        line-height:1.35;
    }


    .flame{
        width:4px;
        height:9px;

        margin-left:-2px;
        margin-top:-8px;

        box-shadow:
            0 0 2px rgba(255,255,220,.95),
            0 0 4px rgba(255,210,91,.9),
            0 0 7px rgba(255,166,64,.55);
    }


    .flame::after{
        width:15px;
        height:15px;
    }


    .twinkle{
        width:2px;
        height:2px;
    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

    .form-bottom{
        margin-top:3px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    .halo-glow,
    .chest-glow,
    .flame,
    .twinkle,
    .glint{
        animation:none !important;
    }

}

</style>
</head>


<body>


<main class="shrine">


<!-- ORIGINAL SHRINE ARTWORK -->

<img
    class="art"
    src="prayer-altar-shrine.png"
    alt="Pastel celestial prayer shrine centred on Jesus."
>


<!-- JESUS LIGHT -->

<div class="halo-glow"></div>
<div class="chest-glow"></div>


<!-- DECORATIVE FLICKERING CANDLES -->

<i class="flame f1"></i>
<i class="flame f2"></i>
<i class="flame f3"></i>
<i class="flame f4"></i>
<i class="flame f5"></i>
<i class="flame f6"></i>
<i class="flame f7"></i>
<i class="flame f8"></i>


<!-- TWINKLING STARS -->

<i class="twinkle t1"></i>
<i class="twinkle t2"></i>
<i class="twinkle t3"></i>
<i class="twinkle t4"></i>
<i class="twinkle t5"></i>
<i class="twinkle t6"></i>
<i class="twinkle t7"></i>
<i class="twinkle t8"></i>
<i class="twinkle t9"></i>
<i class="twinkle t10"></i>
<i class="twinkle t11"></i>
<i class="twinkle t12"></i>
<i class="twinkle t13"></i>
<i class="twinkle t14"></i>
<i class="twinkle t15"></i>
<i class="twinkle t16"></i>
<i class="twinkle t17"></i>
<i class="twinkle t18"></i>


<!-- STAR GLINTS -->

<i class="glint g1"></i>
<i class="glint g2"></i>
<i class="glint g3"></i>
<i class="glint g4"></i>


<!-- =====================================================
     LEAVE A PRAYER
===================================================== -->

<section class="prayer-panel">


    <h2 class="prayer-title">
        Leave a Prayer
    </h2>


    <form id="prayerForm">


        <textarea
            id="prayer"
            name="prayer"
            maxlength="5000"
            required
            aria-label="Write your prayer intention"></textarea>


        <div class="form-bottom">


            <span class="counter">
                <span id="count">0</span> / 5000
            </span>


            <button
                type="submit"
                class="offer-button">

                OFFER PRAYER

            </button>


        </div>


    </form>


    <p class="privacy">
        Your prayer intention will be received privately and prayed over personally.
        Prayers are not displayed publicly
    </p>


</section>


</main>


<script>

/* =========================================================
   CHARACTER COUNTER
========================================================= */

const prayer =
    document.getElementById("prayer");

const count =
    document.getElementById("count");


prayer.addEventListener(
    "input",
    () => {

        count.textContent =
            prayer.value.length;

    }
);


/* =========================================================
   PRAYER SUBMISSION

   Temporarily disabled while visual layout is finalised.
========================================================= */

document
    .getElementById("prayerForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();

        }
    );

</script>


</body>
</html>
